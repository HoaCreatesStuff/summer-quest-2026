<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Summer Quest desktop notice and mobile layout validation</title>
  <style>
    #appFrame {
      position: absolute;
      left: -12000px;
      top: 0;
      width: 1024px;
      height: 768px;
      border: 0;
    }
  </style>
</head>
<body>
  <h1>Summer Quest desktop notice and mobile layout validation</h1>
  <pre id="result">Running…</pre>
  <iframe id="appFrame" title="Summer Quest responsive test app"></iframe>

  <script>
    (async () => {
      const result = document.querySelector("#result");
      const frame = document.querySelector("#appFrame");
      const checks = [];
      const targetWidths = [320, 360, 375, 390, 430];
      const sessionKey = "nyc-summer-quest-desktop-notice-shown";
      const stateKey = "nyc-summer-quest-mvp-v1";

      const wait = milliseconds =>
        new Promise(resolve => setTimeout(resolve, milliseconds));
      const nextFrame = () =>
        new Promise(resolve =>
          requestAnimationFrame(() => requestAnimationFrame(resolve))
        );
      const waitFor = async (predicate, message) => {
        const deadline = Date.now() + 10000;
        while (Date.now() < deadline) {
          if (await predicate()) return;
          await wait(50);
        }
        throw new Error(message);
      };
      const check = (name, condition, details = "") => {
        checks.push({ name, passed: Boolean(condition), details });
      };
      const noHorizontalOverflow = documentUnderTest =>
        documentUnderTest.documentElement.scrollWidth <=
        documentUnderTest.documentElement.clientWidth + 1;
      const rectIsInside = (inner, outer, tolerance = 1) =>
        inner.left >= outer.left - tolerance &&
        inner.right <= outer.right + tolerance &&
        inner.top >= outer.top - tolerance &&
        inner.bottom <= outer.bottom + tolerance;

      try {
        sessionStorage.removeItem(sessionKey);
        localStorage.removeItem(stateKey);
        const loaded = new Promise(resolve => {
          frame.addEventListener("load", resolve, { once: true });
        });
        frame.src = "../index.html?desktop-mobile-validation=1";
        await loaded;
        await waitFor(
          () =>
            frame.contentWindow?.SummerQuestDesktopMobileTestHooks &&
            frame.contentDocument?.querySelectorAll(
              "#questGrid [data-quest-id]"
            ).length === 25,
          "Timed out waiting for the responsive test app to initialize."
        );

        const app = frame.contentWindow;
        const documentUnderTest = frame.contentDocument;
        const hooks = app.SummerQuestDesktopMobileTestHooks;
        const notice = documentUnderTest.querySelector("#desktopNoticeModal");
        const noticeDialog = notice.querySelector("[role='dialog']");
        const continueButton =
          documentUnderTest.querySelector("#continueOnDesktop");

        await waitFor(
          () => !notice.hidden && documentUnderTest.activeElement === continueButton,
          "Desktop notice did not open and receive focus."
        );
        const stateBeforeDismissal = app.localStorage.getItem(stateKey);
        check(
          "Desktop detection combines viewport size, fine pointer, and hover",
          hooks.desktopNoticeConditions({
            width: 1024,
            height: 768,
            finePointer: true,
            hover: true
          }) &&
            !hooks.desktopNoticeConditions({
              width: 390,
              height: 844,
              finePointer: true,
              hover: true
            }) &&
            !hooks.desktopNoticeConditions({
              width: 1024,
              height: 768,
              finePointer: false,
              hover: false
            })
        );
        check(
          "Desktop notice has dialog semantics, title, description, and a 44px action",
          noticeDialog.getAttribute("aria-modal") === "true" &&
            noticeDialog.getAttribute("aria-labelledby") ===
              "desktopNoticeTitle" &&
            noticeDialog.getAttribute("aria-describedby")?.includes(
              "desktopNoticeDescription"
            ) &&
            continueButton.getBoundingClientRect().height >= 44
        );

        continueButton.dispatchEvent(new app.KeyboardEvent("keydown", {
          key: "Tab",
          bubbles: true,
          cancelable: true
        }));
        check(
          "Desktop notice traps keyboard focus",
          documentUnderTest.activeElement === continueButton
        );
        continueButton.dispatchEvent(new app.KeyboardEvent("keydown", {
          key: "Escape",
          bubbles: true,
          cancelable: true
        }));
        await nextFrame();
        check(
          "Escape dismisses the notice without changing saved progress",
          notice.hidden &&
            app.localStorage.getItem(stateKey) === stateBeforeDismissal
        );
        hooks.reevaluateDesktopNotice();
        await nextFrame();
        check(
          "Desktop notice appears only once per browser session",
          notice.hidden && app.sessionStorage.getItem(sessionKey) === "true"
        );

        hooks.resetDesktopNotice();
        const briefingToggle =
          documentUnderTest.querySelector("#briefingToggle");
        briefingToggle.focus();
        hooks.openDesktopNotice();
        await nextFrame();
        continueButton.click();
        await nextFrame();
        check(
          "Dismissing the notice restores focus to the prior control",
          documentUnderTest.activeElement === briefingToggle
        );

        hooks.resetDesktopNotice();
        frame.style.width = "390px";
        frame.style.height = "844px";
        await nextFrame();
        hooks.reevaluateDesktopNotice();
        await nextFrame();
        check(
          "Phone-sized viewports do not show the desktop notice",
          notice.hidden
        );

        const widthResults = [];
        for (const width of targetWidths) {
          frame.style.width = `${width}px`;
          frame.style.height = "844px";
          await nextFrame();
          const cards = Array.from(
            documentUnderTest.querySelectorAll("#questGrid .quest-card")
          );
          widthResults.push({
            width,
            noOverflow: noHorizontalOverflow(documentUnderTest),
            cardTargets: cards.every(card => {
              const rect = card.getBoundingClientRect();
              return rect.width >= 44 && rect.height >= 44;
            })
          });
        }
        check(
          "All target phone widths avoid page overflow and keep board tiles tappable",
          widthResults.every(
            viewport => viewport.noOverflow && viewport.cardTargets
          ),
          widthResults
        );

        frame.style.width = "320px";
        await nextFrame();
        documentUnderTest
          .querySelector('#questGrid [data-quest-id="bodega-cat"]')
          .click();
        await nextFrame();
        const sheet = documentUnderTest.querySelector("#questSheet");
        const header = documentUnderTest.querySelector("#questModalHeader");
        const category = documentUnderTest.querySelector("#sheetCategory");
        const navigation =
          documentUnderTest.querySelector(".quest-navigation");
        const close = documentUnderTest.querySelector("#closeSheet");
        check(
          "Quest header controls fit at 320px without overlap",
          !sheet.hidden &&
            category.getBoundingClientRect().left >=
              header.getBoundingClientRect().left - 1 &&
            category.getBoundingClientRect().right <=
              navigation.getBoundingClientRect().left + 1 &&
            navigation.getBoundingClientRect().right <=
              close.getBoundingClientRect().left + 1 &&
            [navigation.querySelector("button"), close].every(button => {
              const rect = button.getBoundingClientRect();
              return rect.width >= 44 && rect.height >= 44;
            }) &&
            rectIsInside(
              header.getBoundingClientRect(),
              sheet.getBoundingClientRect(),
              12
            )
        );

        const dateControl =
          documentUnderTest.querySelector("#adventureDateControl");
        const friendCounter =
          documentUnderTest.querySelector("#friendsField .counter");
        const dateField =
          documentUnderTest.querySelector(".date-field");
        const friendsField =
          documentUnderTest.querySelector("#friendsField");
        const dateRectAtPhone = dateControl.getBoundingClientRect();
        const friendRectAtPhone = friendCounter.getBoundingClientRect();
        check(
          "Date and friend count stack at full width on small phones",
          friendRectAtPhone.top > dateRectAtPhone.bottom &&
            Math.abs(dateRectAtPhone.width - friendRectAtPhone.width) <= 1 &&
            Math.abs(dateRectAtPhone.height - friendRectAtPhone.height) <= 1 &&
            dateRectAtPhone.height >= 44 &&
            friendRectAtPhone.height >= 44 &&
            noHorizontalOverflow(documentUnderTest)
        );
        const friendSegments = [
          friendCounter.querySelector("#decrementFriends"),
          friendCounter.querySelector("output"),
          friendCounter.querySelector("#incrementFriends")
        ].map(element => element.getBoundingClientRect());
        check(
          "Friend counter fills its field with balanced 20/60/20 segments",
          Math.abs(
            friendRectAtPhone.width -
              friendsField.getBoundingClientRect().width
          ) <= 1 &&
            Math.abs(friendSegments[0].width - friendSegments[2].width) <= 1 &&
            Math.abs(
              friendSegments[1].width / friendRectAtPhone.width - 0.6
            ) <= 0.02 &&
            [friendSegments[0], friendSegments[2]].every(
              segment =>
                segment.height >= 44 &&
                Math.abs(segment.height - (friendRectAtPhone.height - 2)) <= 1
            )
        );

        const questForm = documentUnderTest.querySelector("#questForm");
        const locationInput =
          documentUnderTest.querySelector("#locationInput");
        locationInput.focus();
        frame.style.height = "560px";
        await nextFrame();
        hooks.syncFocusedControlViewport();
        hooks.positionFocusedControlForKeyboard();
        await wait(380);
        check(
          "A focused location field remains visible in a keyboard-height viewport",
          rectIsInside(
            locationInput.closest(".field").getBoundingClientRect(),
            questForm.getBoundingClientRect(),
            24
          )
        );

        const caption = documentUnderTest.querySelector("#captionInput");
        caption.value = Array.from(
          { length: 18 },
          (_, index) =>
            `Long saved caption line ${index + 1} for a small phone viewport.`
        ).join("\n");
        caption.dispatchEvent(new app.Event("input", { bubbles: true }));
        caption.focus();
        await nextFrame();
        hooks.syncFocusedControlViewport();
        hooks.positionFocusedControlForKeyboard();
        await wait(380);
        check(
          "Long captions keep an internal scroller and a visible active field",
          app.getComputedStyle(caption).overflowY === "auto" &&
            caption.scrollHeight > caption.clientHeight &&
            rectIsInside(
              caption.closest(".caption-field").getBoundingClientRect(),
              questForm.getBoundingClientRect(),
              24
            )
        );

        frame.style.width = "844px";
        frame.style.height = "390px";
        await nextFrame();
        const dateRectAtDesktop = dateField.getBoundingClientRect();
        const friendRectAtDesktop = friendsField.getBoundingClientRect();
        check(
          "Landscape and short-height quest layouts retain internal scrolling without page overflow",
          noHorizontalOverflow(documentUnderTest) &&
            app.getComputedStyle(questForm).overflowY === "auto" &&
            !close.hidden
        );
        check(
          "Date and friend count share an equal-width row on larger screens",
          Math.abs(dateRectAtDesktop.top - friendRectAtDesktop.top) <= 1 &&
            Math.abs(dateRectAtDesktop.width - friendRectAtDesktop.width) <= 1 &&
            dateRectAtDesktop.right < friendRectAtDesktop.left &&
            noHorizontalOverflow(documentUnderTest)
        );

        close.click();
        await nextFrame();
        frame.style.width = "320px";
        frame.style.height = "844px";
        documentUnderTest.querySelector("#viewBoardBtn").click();
        await waitFor(
          () => documentUnderTest.body.dataset.page === "story",
          "Journal route did not open."
        );
        check(
          "Summer Journal fits at 320px and does not summon the desktop notice",
          noHorizontalOverflow(documentUnderTest) && notice.hidden
        );

        documentUnderTest
          .querySelector('[data-route="keepsake"]')
          .click();
        await waitFor(
          () => documentUnderTest.body.dataset.page === "keepsake",
          "Keepsake route did not open."
        );
        hooks.resetDesktopNotice();
        hooks.reevaluateDesktopNotice();
        await nextFrame();
        const preview =
          documentUnderTest.querySelector("#keepsakePreviewStage");
        check(
          "Keepsake fits at 320px and suppresses the desktop notice",
          noHorizontalOverflow(documentUnderTest) &&
            notice.hidden &&
            preview.getBoundingClientRect().right <=
              documentUnderTest.documentElement.clientWidth + 1
        );

        const cssText = Array.from(documentUnderTest.styleSheets)
          .filter(sheetRecord => {
            try {
              return Boolean(sheetRecord.cssRules);
            } catch {
              return false;
            }
          })
          .flatMap(sheetRecord => Array.from(sheetRecord.cssRules))
          .map(rule => rule.cssText)
          .join("\n");
        check(
          "Responsive CSS includes safe-area, reduced-motion, and print suppression",
          cssText.includes("safe-area-inset") &&
            cssText.includes("prefers-reduced-motion") &&
            cssText.includes(".desktop-notice-modal") &&
            cssText.includes("@media print")
        );
      } catch (error) {
        checks.push({
          name: "Validation completed without an uncaught error",
          passed: false,
          details: error?.stack || String(error)
        });
      }

      const failures = checks.filter(test => !test.passed);
      result.textContent = [
        ...checks.map(test =>
          `${test.passed ? "PASS" : "FAIL"}: ${test.name}` +
          (test.details
            ? `\n${JSON.stringify(test.details, null, 2)}`
            : "")
        ),
        "",
        `${checks.length - failures.length}/${checks.length} checks passed.`
      ].join("\n");
      document.title = failures.length
        ? `FAIL (${failures.length}) — ${document.title}`
        : `PASS — ${document.title}`;
      document.body.dataset.validationStatus =
        failures.length ? "failed" : "passed";
    })();
  </script>
</body>
</html>
