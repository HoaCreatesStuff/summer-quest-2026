<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Summer Quest Analytics Validation</title>
</head>
<body>
  <h1>Summer Quest analytics validation</h1>
  <pre id="result">Running...</pre>

  <script>
    (async () => {
      const result = document.querySelector("#result");
      const checks = [];

      function check(name, condition, details = "") {
        checks.push({ name, passed: Boolean(condition), details });
      }

      try {
        const [analyticsSource, appSource, versionSource, receiverSource] = await Promise.all([
          fetch("../data/analytics.js", { cache: "no-store" }).then(response => response.text()),
          fetch("../data/app.js", { cache: "no-store" }).then(response => response.text()),
          fetch("../version.js", { cache: "no-store" }).then(response => response.text()),
          fetch("../google-apps-script/analytics/Code.gs", { cache: "no-store" })
            .then(response => response.text())
        ]);
        const buildVersion = versionSource.match(
          /const BUILD_VERSION = "(\d{5})";/
        )?.[1];

        function createHarness({
          store = new Map(),
          online = true,
          storageThrows = false,
          beaconAccepted = true,
          fetchRejects = false,
          fetchThrows = false,
          runTimers = false,
          randomSeed = 1
        } = {}) {
          const sent = [];
          const attempts = { beacon: 0, fetch: 0 };
          let randomCounter = randomSeed;
          const fakeStorage = {
            getItem(key) {
              if (storageThrows) throw new Error("storage blocked");
              return store.has(key) ? store.get(key) : null;
            },
            setItem(key, value) {
              if (storageThrows) throw new Error("storage blocked");
              store.set(key, String(value));
            },
            removeItem(key) {
              if (storageThrows) throw new Error("storage blocked");
              store.delete(key);
            }
          };
          const fakeWindow = {
            location: { search: "" },
            SUMMER_QUEST_BUILD: { version: buildVersion },
            matchMedia(query) {
              return { matches: query.includes("browser") };
            },
            addEventListener() {},
            setTimeout(callback, delay) {
              return runTimers ? window.setTimeout(callback, Math.min(delay, 10)) : 1;
            },
            clearTimeout(timer) {
              if (runTimers) window.clearTimeout(timer);
            }
          };
          const fakeNavigator = {
            onLine: online,
            platform: "QA Platform",
            language: "en-US",
            sendBeacon(url, blob) {
              attempts.beacon += 1;
              if (beaconAccepted) sent.push({ url, blob });
              return beaconAccepted;
            }
          };
          const fakeDocument = {
            querySelector(selector) {
              return selector.includes("application-version")
                ? { content: buildVersion }
                : null;
            }
          };
          const fakeCrypto = {
            getRandomValues(bytes) {
              for (let index = 0; index < bytes.length; index += 1) {
                bytes[index] = (randomCounter + index * 31) % 256;
              }
              randomCounter += 17;
              return bytes;
            }
          };
          const loadAnalytics = new Function(
            "window",
            "navigator",
            "localStorage",
            "document",
            "crypto",
            "URLSearchParams",
            "Date",
            "Blob",
            "AbortController",
            "fetch",
            "console",
            `${analyticsSource}\nreturn window.SummerQuestAnalytics;`
          );
          const api = loadAnalytics(
            fakeWindow,
            fakeNavigator,
            fakeStorage,
            fakeDocument,
            fakeCrypto,
            URLSearchParams,
            Date,
            Blob,
            AbortController,
            (url, options) => {
              attempts.fetch += 1;
              if (fetchThrows) throw new Error("fetch unavailable");
              if (fetchRejects) return Promise.reject(new Error("network failed"));
              sent.push({ url, body: options?.body });
              return Promise.resolve({ ok: true });
            },
            { info() {}, warn() {}, error() {} }
          );

          return {
            api,
            store,
            attempts,
            async payloads() {
              return Promise.all(sent.map(async entry =>
                JSON.parse(entry.blob ? await entry.blob.text() : entry.body)
              ));
            }
          };
        }

        function questContext(state) {
          return {
            appVersion: buildVersion,
            getState: () => state,
            quests: {
              first: {
                title: "First Quest",
                basePoints: 10,
                bonuses: [{ id: "bonus", points: 3 }]
              },
              final: { title: "Final Quest", basePoints: 25, bonuses: [] }
            },
            boardOrder: ["first", "final"],
            normalizeFriendCount: value => Number(value) || 0,
            canonicalSelectedBonusIds: (quest, submission) =>
              submission?.selectedBonusIds || [],
            questPoints: (submission, questId) => questId === "first" ? 17 : 25,
            totalsForSubmissions: submissions => ({
              completed: Object.values(submissions).filter(item => item?.completed).length,
              score: Object.entries(submissions).reduce(
                (sum, [questId, submission]) =>
                  sum + (submission?.completed ? (questId === "first" ? 17 : 25) : 0),
                0
              )
            }),
            isFinalQuest: questId => questId === "final",
            rankForScore: score => ({ title: score >= 40 ? "Summer Legend" : "Summer Rookie" })
          };
        }

        const state = { submissions: {} };
        const harness = createHarness();
        harness.api.init(questContext(state));
        harness.api.trackMissionBriefingCompleted();
        harness.api.trackMissionBriefingCompleted();
        harness.api.trackQuestOpened("first");
        harness.api.trackQuestOpened("first");

        const privateSubmission = {
          completed: true,
          completedAt: "2026-08-05T12:34:56.000Z",
          adventureDate: "2026-08-05",
          friends: 2,
          selectedBonusIds: ["bonus"],
          caption: "private",
          reflection: "private",
          location: "private",
          name: "private",
          email: "private@example.com",
          mediaId: "private",
          metadata: { private: true }
        };
        state.submissions.first = privateSubmission;
        harness.api.trackQuestSaved({
          questId: "first",
          submission: privateSubmission,
          previousCompletedCount: 0,
          wasCompletedBefore: false
        });
        harness.api.trackQuestSaved({
          questId: "first",
          submission: privateSubmission,
          previousCompletedCount: 1,
          wasCompletedBefore: true
        });
        const payloads = await harness.payloads();
        const eventCounts = payloads.reduce((counts, payload) => {
          counts[payload.eventName] = (counts[payload.eventName] || 0) + 1;
          return counts;
        }, {});
        const forbiddenFields = [
          "caption", "reflection", "location", "name", "email",
          "mediaId", "metadata", "photo"
        ];

        check(
          "Every event includes the anonymous common fields",
          payloads.every(payload => [
            "installationId", "sessionId", "eventName", "timestamp",
            "build", "platform", "displayMode", "language"
          ].every(field => payload[field] != null))
        );
        check(
          "Installation and session identifiers use the expected formats",
          /^SQ-[A-F0-9]{8}$/.test(payloads[0]?.installationId || "") &&
            /^SESSION-[A-F0-9]{6}$/.test(payloads[0]?.sessionId || "")
        );
        check(
          "One-time and per-quest events are deduplicated",
          eventCounts.mission_briefing_completed === 1 &&
            eventCounts.quest_opened === 1 &&
            eventCounts.quest_completed === 1 &&
            eventCounts.first_quest_completed === 1,
          eventCounts
        );
        check(
          "Quest payload excludes private memory fields",
          payloads.every(payload =>
            forbiddenFields.every(field => !Object.hasOwn(payload, field))
          )
        );
        const questPayload = payloads.find(
          payload => payload.eventName === "quest_completed"
        );
        check(
          "Quest completion payload preserves the required gameplay fields",
          questPayload?.questId === "first" &&
            questPayload?.questTitle === "First Quest" &&
            questPayload?.completedAt === privateSubmission.completedAt &&
            questPayload?.adventureDate === privateSubmission.adventureDate &&
            questPayload?.points === 17 &&
            questPayload?.friendCount === 2 &&
            questPayload?.bonusEarned === true &&
            questPayload?.bonusCount === 1 &&
            JSON.stringify(questPayload?.bonusIds) === JSON.stringify(["bonus"]) &&
            questPayload?.historical === false,
          questPayload
        );
        check(
          "Accepted beacon and fetch fallback are mutually exclusive",
          harness.attempts.beacon > 0 && harness.attempts.fetch === 0,
          harness.attempts
        );

        const fallback = createHarness({ beaconAccepted: false });
        const fallbackState = { submissions: { first: privateSubmission } };
        fallback.api.init(questContext(fallbackState));
        fallback.api.trackQuestSaved({
          questId: "first",
          submission: privateSubmission,
          previousCompletedCount: 0,
          wasCompletedBefore: false
        });
        await Promise.resolve();
        check(
          "Rejected beacon uses one fetch fallback",
          fallback.attempts.beacon > 0 &&
            fallback.attempts.fetch === fallback.attempts.beacon,
          fallback.attempts
        );

        const failedSend = createHarness({
          beaconAccepted: false,
          fetchThrows: true
        });
        failedSend.api.init(questContext({ submissions: {} }));
        failedSend.api.trackQuestSaved({
          questId: "first",
          submission: privateSubmission,
          previousCompletedCount: 0,
          wasCompletedBefore: false
        });
        const failedDedupe = JSON.parse(
          failedSend.store.get("summerQuestAnalyticsDedupe") || "{}"
        );
        check(
          "Failed initiation does not persist quest completion dedupe",
          !failedDedupe["quest_completed:first"],
          failedDedupe
        );

        const submitBranchStart = appSource.indexOf(
          'els.form.addEventListener("submit"'
        );
        const submitBranch = appSource.slice(
          submitBranchStart,
          appSource.indexOf("const obsoleteMediaIds", submitBranchStart)
        );
        check(
          "Completion tracking follows successful local persistence",
          submitBranchStart >= 0 &&
            submitBranch.indexOf("save();") >= 0 &&
            submitBranch.indexOf("analyticsSync?.trackQuestSaved") >
              submitBranch.indexOf("save();") &&
            submitBranch.includes("wasCompletedBefore"),
          submitBranchStart
        );

        check(
          "Development-only completion logs cover prepared, skipped, sent, and failed",
          [
            "[Analytics] quest_completed prepared",
            "[Analytics] quest_completed skipped: already completed",
            "[Analytics] quest_completed skipped: sharing off",
            "[Analytics] quest_completed sent",
            "[Analytics] quest_completed failed"
          ].every(message => analyticsSource.includes(message))
        );

        check(
          "Apps Script receiver maps completion and historical columns",
          [
            "Event Timestamp", "Event Name", "Installation ID", "Session ID",
            "Quest ID", "Quest Title", "Completed At", "Adventure Date",
            "Points", "Friend Count", "Bonus Earned", "Bonus Count",
            "Bonus IDs", "Build", "Platform", "Display Mode", "Language",
            "Historical"
          ].every(header => receiverSource.includes(`"${header}"`)) &&
            receiverSource.includes("ensureAnalyticsHeaders")
        );

        const optedOutStore = new Map([
          ["summerQuestAnonymousSharingEnabled", "false"]
        ]);
        const optedOut = createHarness({ store: optedOutStore });
        const optedOutState = { submissions: { first: privateSubmission } };
        optedOut.api.init(questContext(optedOutState));
        optedOut.api.trackFeature("privacy_opened");
        check(
          "Opt-out sends nothing and creates no installation ID",
          (await optedOut.payloads()).length === 0 &&
            !optedOutStore.has("summerQuestInstallationId")
        );
        optedOut.api.setSharingEnabled(true);
        optedOut.api.trackQuestSaved({
          questId: "first",
          submission: privateSubmission,
          previousCompletedCount: 0,
          wasCompletedBefore: false
        });
        check(
          "Re-enabling sharing allows future completions",
          (await optedOut.payloads()).some(
            payload => payload.eventName === "quest_completed"
          )
        );

        const twoQuestState = { submissions: {} };
        const twoQuestHarness = createHarness({ randomSeed: 20 });
        twoQuestHarness.api.init(questContext(twoQuestState));
        twoQuestState.submissions.first = privateSubmission;
        twoQuestHarness.api.trackQuestSaved({
          questId: "first",
          submission: privateSubmission,
          previousCompletedCount: 0,
          wasCompletedBefore: false
        });
        const finalSubmission = {
          completed: true,
          completedAt: "2026-08-05T18:00:00.000Z",
          adventureDate: "2026-08-05",
          friends: 0,
          selectedBonusIds: []
        };
        twoQuestState.submissions.final = finalSubmission;
        twoQuestHarness.api.trackQuestSaved({
          questId: "final",
          submission: finalSubmission,
          previousCompletedCount: 1,
          wasCompletedBefore: false
        });
        check(
          "Different quests create separate completion events",
          (await twoQuestHarness.payloads())
            .filter(payload => payload.eventName === "quest_completed")
            .map(payload => payload.questId)
            .join(",") === "first,final"
        );

        const offlineStore = new Map();
        const offline = createHarness({ store: offlineStore, online: false });
        offline.api.init(questContext({ submissions: {} }));
        offline.api.trackQuestOpened("first");
        check(
          "Offline events are skipped without IDs or dedupe state",
          (await offline.payloads()).length === 0 &&
            !offlineStore.has("summerQuestInstallationId") &&
            !offlineStore.has("summerQuestAnalyticsDedupe")
        );

        const historicalStore = new Map();
        const historicalState = {
          submissions: {
            first: privateSubmission
          }
        };
        const historical = createHarness({
          store: historicalStore,
          runTimers: true,
          randomSeed: 30
        });
        historical.api.init(questContext(historicalState));
        await new Promise(resolve => window.setTimeout(resolve, 60));
        const historicalPayloads = await historical.payloads();
        const historicalQuestPayloads = historicalPayloads.filter(
          payload => payload.eventName === "quest_completed"
        );
        check(
          "Saved completions backfill once with original values",
          historicalQuestPayloads.length === 1 &&
            historicalQuestPayloads[0].historical === true &&
            historicalQuestPayloads[0].completedAt === privateSubmission.completedAt &&
            historicalQuestPayloads[0].adventureDate === privateSubmission.adventureDate &&
            historicalQuestPayloads[0].points === 17 &&
            historicalQuestPayloads[0].friendCount === 2 &&
            historicalQuestPayloads[0].bonusCount === 1,
          historicalQuestPayloads
        );

        const historicalRefresh = createHarness({
          store: historicalStore,
          runTimers: true,
          randomSeed: 60
        });
        historicalRefresh.api.init(questContext(historicalState));
        await new Promise(resolve => window.setTimeout(resolve, 60));
        check(
          "Historical completion does not rerun on refresh",
          (await historicalRefresh.payloads()).every(
            payload => payload.eventName !== "quest_completed"
          )
        );

        const historicalAdventure = createHarness({
          store: new Map(),
          runTimers: true,
          randomSeed: 75
        });
        historicalAdventure.api.init(questContext({
          submissions: {
            first: privateSubmission,
            final: finalSubmission
          }
        }));
        await new Promise(resolve => window.setTimeout(resolve, 80));
        const historicalAdventurePayloads = (await historicalAdventure.payloads())
          .filter(payload => payload.eventName === "adventure_completed");
        check(
          "A saved final quest backfills one historical adventure completion",
          historicalAdventurePayloads.length === 1 &&
            historicalAdventurePayloads[0].historical === true &&
            historicalAdventurePayloads[0].totalCompletedQuests === 2 &&
            historicalAdventurePayloads[0].totalPoints === 42,
          historicalAdventurePayloads
        );

        const retryStore = new Map();
        const failedHistorical = createHarness({
          store: retryStore,
          runTimers: true,
          fetchRejects: true,
          randomSeed: 90
        });
        failedHistorical.api.init(questContext(historicalState));
        await new Promise(resolve => window.setTimeout(resolve, 60));
        const failedHistoricalDedupe = JSON.parse(
          retryStore.get("summerQuestAnalyticsDedupe") || "{}"
        );
        const retriedHistorical = createHarness({
          store: retryStore,
          runTimers: true,
          randomSeed: 120
        });
        retriedHistorical.api.init(questContext(historicalState));
        await new Promise(resolve => window.setTimeout(resolve, 60));
        check(
          "Failed historical fetch stays eligible for a future launch",
          !failedHistoricalDedupe["historical_quest_completed:first"] &&
            (await retriedHistorical.payloads()).some(
              payload => payload.eventName === "quest_completed" &&
                payload.historical === true
            ),
          failedHistoricalDedupe
        );

        let blockedStorageThrew = false;
        try {
          const blocked = createHarness({ storageThrows: true });
          blocked.api.init(questContext({ submissions: {} }));
          blocked.api.setSharingEnabled(false);
          blocked.api.trackFeature("privacy_opened");
          blocked.api.debugState();
        } catch {
          blockedStorageThrew = true;
        }
        check(
          "Blocked browser storage never throws into gameplay",
          !blockedStorageThrew
        );

        const observerHarness = createHarness();
        observerHarness.api.onStatusChange(() => {
          throw new Error("observer failure");
        });
        let observerThrew = false;
        try {
          observerHarness.api.init(questContext({ submissions: {} }));
        } catch {
          observerThrew = true;
        }
        check("Analytics observers cannot interrupt gameplay", !observerThrew);

        check(
          "Android help confirmation does not claim installation",
          appSource.includes('selectedHomeScreenPlatform() === "iphone"') &&
            appSource.includes('"ios_install_help_confirmed"')
        );
        check(
          "Finale completion is emitted only after a played animation",
          appSource.includes("if (result?.played === true)")
        );

        const failed = checks.filter(item => !item.passed);
        result.textContent = JSON.stringify({
          status: failed.length ? "FAIL" : "PASS",
          buildVersion,
          passed: checks.length - failed.length,
          failed: failed.length,
          checks
        }, null, 2);
      } catch (error) {
        result.textContent = JSON.stringify({
          status: "ERROR",
          message: error.message,
          stack: error.stack
        }, null, 2);
      }
    })();
  </script>
</body>
</html>
