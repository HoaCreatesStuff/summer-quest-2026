<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Summer Quest Analytics v1.0 Validation</title>
</head>
<body>
  <h1>Summer Quest Analytics v1.0 validation</h1>
  <pre id="result">Running...</pre>

  <script>
    (async () => {
      const result = document.querySelector("#result");
      const checks = [];

      function check(name, condition, details = "") {
        checks.push({ name, passed: Boolean(condition), details });
      }

      function countEvents(payloads) {
        return payloads.reduce((counts, payload) => {
          counts[payload.eventName] = (counts[payload.eventName] || 0) + 1;
          return counts;
        }, {});
      }

      try {
        const validationNonce = Date.now();
        const validationUrl = path => `${path}?validation=${validationNonce}`;
        const [
          analyticsSource,
          appSource,
          journalSource,
          versionSource,
          receiverSource
        ] = await Promise.all([
          fetch(validationUrl("../data/analytics.js"), { cache: "no-store" })
            .then(response => response.text()),
          fetch(validationUrl("../data/app.js"), { cache: "no-store" })
            .then(response => response.text()),
          fetch(validationUrl("../data/journal.js"), { cache: "no-store" })
            .then(response => response.text()),
          fetch(validationUrl("../version.js"), { cache: "no-store" })
            .then(response => response.text()),
          fetch(validationUrl("../google-apps-script/analytics/Code.gs"), {
            cache: "no-store"
          })
            .then(response => response.text())
        ]);
        const buildVersion = versionSource.match(/const BUILD_VERSION = "(\d{6})";/)?.[1];

        [analyticsSource, appSource, journalSource, versionSource, receiverSource]
          .forEach(source => new Function(source));

        function createHarness({
          store = new Map(),
          online = true,
          standalone = false,
          storageThrows = false,
          beaconAccepted = true,
          fetchRejects = false,
          fetchRejectOn = 0,
          fetchThrows = false,
          runTimers = false,
          randomSeed = 1,
          protocol = "http:",
          hostname = "localhost",
          pathname = "/tests/analytics-validation.html",
          search = "",
          hash = ""
        } = {}) {
          const sent = [];
          const attempts = { beacon: 0, fetch: 0 };
          const listeners = {};
          const replacedUrls = [];
          let randomCounter = randomSeed;
          const fakeStorage = {
            getItem(key) {
              if (storageThrows) throw new Error("storage blocked");
              return store.has(key) ? store.get(key) : null;
            },
            setItem(key, value) {
              if (storageThrows) throw new Error("storage blocked");
              store.set(key, String(value));
            }
          };
          const fakeWindow = {
            location: { search, protocol, hostname, pathname, hash },
            history: {
              state: null,
              replaceState(state, title, url) {
                this.state = state;
                replacedUrls.push(url);
              }
            },
            SUMMER_QUEST_BUILD: { version: buildVersion },
            matchMedia(query) {
              return { matches: standalone ? query.includes("standalone") : query.includes("browser") };
            },
            addEventListener(name, listener) {
              listeners[name] ||= [];
              listeners[name].push(listener);
            },
            setTimeout(callback, delay) {
              return runTimers ? window.setTimeout(callback, Math.min(delay, 5)) : 1;
            },
            clearTimeout(timer) {
              if (runTimers) window.clearTimeout(timer);
            }
          };
          const fakeNavigator = {
            onLine: online,
            platform: "QA Platform",
            language: "en-US",
            sendBeacon(url, blob) {
              attempts.beacon += 1;
              if (beaconAccepted) sent.push({ url, blob });
              return beaconAccepted;
            }
          };
          const fakeDocument = {
            querySelector(selector) {
              return selector.includes("application-version")
                ? { content: buildVersion }
                : null;
            }
          };
          const fakeCrypto = {
            getRandomValues(bytes) {
              for (let index = 0; index < bytes.length; index += 1) {
                bytes[index] = (randomCounter + index * 31) % 256;
              }
              randomCounter += 17;
              return bytes;
            }
          };
          const loadAnalytics = new Function(
            "window",
            "navigator",
            "localStorage",
            "document",
            "crypto",
            "URLSearchParams",
            "Date",
            "Blob",
            "AbortController",
            "fetch",
            "console",
            `${analyticsSource}\nreturn window.SummerQuestAnalytics;`
          );
          const api = loadAnalytics(
            fakeWindow,
            fakeNavigator,
            fakeStorage,
            fakeDocument,
            fakeCrypto,
            URLSearchParams,
            Date,
            Blob,
            AbortController,
            (url, options) => {
              attempts.fetch += 1;
              if (fetchThrows) throw new Error("fetch unavailable");
              if (fetchRejects || attempts.fetch === fetchRejectOn) {
                return Promise.reject(new Error("network failed"));
              }
              sent.push({ url, body: options?.body });
              return Promise.resolve({
                ok: true,
                status: 200,
                text: () => Promise.resolve(JSON.stringify({
                  ok: true,
                  receiverVersion: "8"
                }))
              });
            },
            { info() {}, warn() {}, error() {} }
          );

          return {
            api,
            window: fakeWindow,
            store,
            attempts,
            replacedUrls,
            dispatch(name) {
              (listeners[name] || []).forEach(listener => listener());
            },
            async payloads() {
              return Promise.all(sent.map(async entry =>
                JSON.parse(entry.blob ? await entry.blob.text() : entry.body)
              ));
            }
          };
        }

        function questContext(state, { hadStoredAppState = false } = {}) {
          return {
            hadStoredAppState,
            appVersion: buildVersion,
            getState: () => state,
            quests: {
              first: {
                title: "First Quest",
                basePoints: 10,
                bonuses: [{ id: "bonus", points: 3 }]
              },
              final: { title: "Final Quest", basePoints: 25, bonuses: [] }
            },
            boardOrder: ["first", "final"],
            normalizeFriendCount: value => Number(value) || 0,
            canonicalSelectedBonusIds: (quest, submission) =>
              submission?.selectedBonusIds || [],
            questPoints: (submission, questId) => questId === "first" ? 17 : 25,
            totalsForSubmissions: submissions => ({
              completed: Object.values(submissions).filter(item => item?.completed).length,
              score: Object.entries(submissions).reduce(
                (sum, [questId, submission]) =>
                  sum + (submission?.completed ? (questId === "first" ? 17 : 25) : 0),
                0
              )
            }),
            isFinalQuest: questId => questId === "final",
            rankForScore: score => ({ title: score >= 40 ? "Summer Legend" : "Summer Rookie" })
          };
        }

        const privateSubmission = {
          completed: true,
          completedAt: "2026-08-05T12:34:56.000Z",
          adventureDate: "2026-08-05",
          friends: 2,
          selectedBonusIds: ["bonus"],
          caption: "private caption",
          reflection: "private reflection",
          location: "private location",
          locationName: "private location name",
          name: "Private Name",
          email: "private@example.com",
          mediaId: "private-media",
          blobUrl: "blob:private",
          keepsakeImage: "data:image/png,private",
          feedbackMessage: "private feedback",
          metadata: { private: true }
        };
        const finalSubmission = {
          completed: true,
          completedAt: "2026-08-05T18:00:00.000Z",
          adventureDate: "2026-08-05",
          friends: 0,
          selectedBonusIds: []
        };

        const allowedEvents = [
          "app_first_opened",
          "app_opened",
          "app_installed",
          "quest_completed",
          "first_quest_completed",
          "adventure_completed",
          "journal_first_opened",
          "journal_opened",
          "keepsake_first_opened",
          "keepsake_opened",
          "keepsake_generated",
          "privacy_opened",
          "feedback_submitted"
        ];
        const freshState = { submissions: {} };
        const fresh = createHarness();
        fresh.api.init(questContext(freshState));
        fresh.dispatch("appinstalled");
        fresh.dispatch("appinstalled");
        fresh.api.trackJournalOpened();
        fresh.api.trackJournalOpened();
        fresh.api.trackKeepsakeOpened();
        fresh.api.trackKeepsakeOpened();
        fresh.api.trackKeepsakeGenerated();
        fresh.api.trackKeepsakeGenerated();
        fresh.api.trackPrivacyOpened();
        fresh.api.trackPrivacyOpened();
        fresh.api.trackFeedbackSubmitted();
        fresh.api.trackFeedbackSubmitted();

        freshState.submissions.first = privateSubmission;
        fresh.api.trackQuestSaved({
          questId: "first",
          submission: privateSubmission,
          previousCompletedCount: 0,
          wasCompletedBefore: false
        });
        fresh.api.trackQuestSaved({
          questId: "first",
          submission: privateSubmission,
          previousCompletedCount: 1,
          wasCompletedBefore: true
        });
        freshState.submissions.final = finalSubmission;
        fresh.api.trackQuestSaved({
          questId: "final",
          submission: finalSubmission,
          previousCompletedCount: 1,
          wasCompletedBefore: false
        });
        fresh.api.trackQuestSaved({
          questId: "final",
          submission: finalSubmission,
          previousCompletedCount: 2,
          wasCompletedBefore: true
        });

        const freshPayloads = await fresh.payloads();
        const freshCounts = countEvents(freshPayloads);
        check(
          "Fresh installation emits every Analytics v1.0 event at the required frequency",
          freshCounts.app_first_opened === 1 &&
            freshCounts.app_opened === 1 &&
            freshCounts.app_installed === 1 &&
            freshCounts.quest_completed === 2 &&
            freshCounts.first_quest_completed === 1 &&
            freshCounts.adventure_completed === 1 &&
            freshCounts.journal_first_opened === 1 &&
            freshCounts.journal_opened === 1 &&
            freshCounts.keepsake_first_opened === 1 &&
            freshCounts.keepsake_opened === 1 &&
            freshCounts.keepsake_generated === 2 &&
            freshCounts.privacy_opened === 1 &&
            freshCounts.feedback_submitted === 2,
          freshCounts
        );
        check(
          "Only allowlisted Analytics v1.0 events can be emitted",
          freshPayloads.every(payload => allowedEvents.includes(payload.eventName)) &&
            allowedEvents.every(eventName => analyticsSource.includes(`${eventName}:`))
        );

        const requiredCommonFields = [
          "installationId", "sessionId", "eventName", "eventKey", "timestamp", "build",
          "platform", "displayMode", "language", "historical", "feature", "source",
          "environment", "is_test"
        ];
        check(
          "Every payload contains the complete anonymous common contract",
          freshPayloads.every(payload => requiredCommonFields.every(
            field => payload[field] !== undefined && payload[field] !== null && payload[field] !== ""
          ))
        );
        check(
          "Fresh events are live and identifiers have the required format",
          freshPayloads.every(payload => payload.historical === false) &&
            /^SQ-[A-F0-9]{8}$/.test(freshPayloads[0]?.installationId || "") &&
            /^SESSION-[A-F0-9]{6}$/.test(freshPayloads[0]?.sessionId || "")
        );
        check(
          "Localhost analytics is automatically marked as development test data",
          freshPayloads.every(payload =>
            payload.environment === "development" && payload.is_test === true
          )
        );

        const loopback = createHarness({ hostname: "127.0.0.1" });
        loopback.api.init(questContext({ submissions: {} }));
        const preview = createHarness({
          protocol: "https:",
          hostname: "summer-quest-preview.example.com",
          pathname: "/summer-quest-2026/"
        });
        preview.api.init(questContext({ submissions: {} }));
        check(
          "Loopback and non-production hosts remain development test data",
          [...await loopback.payloads(), ...await preview.payloads()].every(payload =>
            payload.environment === "development" && payload.is_test === true
          )
        );

        const production = createHarness({
          protocol: "https:",
          hostname: "hoacreatesstuff.github.io",
          pathname: "/summer-quest-2026/"
        });
        production.api.init(questContext({ submissions: {} }));
        check(
          "Exact Summer Quest Pages URL is automatically marked as beta production data",
          (await production.payloads()).every(payload =>
            payload.environment === "beta" && payload.is_test === false
          ) && production.window.SummerQuestAnalyticsDebug === undefined
        );

        const developerStore = new Map();
        const developerEnabled = createHarness({
          store: developerStore,
          protocol: "https:",
          hostname: "hoacreatesstuff.github.io",
          pathname: "/summer-quest-2026/",
          search: "?developer=true&source=pwa",
          hash: "#journal"
        });
        developerEnabled.api.init(questContext({ submissions: {} }));
        check(
          "developer=true enables test analytics and preserves the Pages path during URL cleanup",
          (await developerEnabled.payloads()).every(payload =>
            payload.environment === "development" && payload.is_test === true
          ) &&
            developerStore.get("summerQuestDeveloperMode") === "true" &&
            developerEnabled.replacedUrls.join(",") ===
              "/summer-quest-2026/?source=pwa#journal"
        );
        const developerReport = await developerEnabled.window
          .SummerQuestAnalyticsDebug?.report?.();
        check(
          "Developer debug report exposes only operational analytics and cache state",
          developerReport?.developerMode === "enabled" &&
            developerReport?.analyticsEnvironment === "development" &&
            developerReport?.isTest === true &&
            developerReport?.installationId ===
              developerStore.get("summerQuestInstallationId") &&
            developerReport?.currentPathname === "/summer-quest-2026/" &&
            developerReport?.serviceWorkerVersion === "unavailable" &&
            developerReport?.controllingServiceWorkerState === "none" &&
            developerReport?.appVersion === buildVersion &&
            developerReport?.cacheVersion === "unavailable" &&
            developerReport?.pendingAnalyticsQueueCount === 0
        );

        const developerPersisted = createHarness({
          store: developerStore,
          protocol: "https:",
          hostname: "hoacreatesstuff.github.io",
          pathname: "/summer-quest-2026/",
          randomSeed: 15
        });
        developerPersisted.api.init(questContext({ submissions: {} }));
        check(
          "Developer Mode persists in the browser without another query parameter",
          (await developerPersisted.payloads()).every(payload =>
            payload.environment === "development" && payload.is_test === true
          ) && developerPersisted.replacedUrls.length === 0
        );

        const developerDisabled = createHarness({
          store: developerStore,
          protocol: "https:",
          hostname: "hoacreatesstuff.github.io",
          pathname: "/summer-quest-2026/",
          search: "?developer=false",
          randomSeed: 25
        });
        developerDisabled.api.init(questContext({ submissions: {} }));
        check(
          "developer=false disables test analytics until explicitly changed",
          (await developerDisabled.payloads()).every(payload =>
            payload.environment === "beta" && payload.is_test === false
          ) &&
            developerStore.get("summerQuestDeveloperMode") === "false" &&
            developerDisabled.replacedUrls.join(",") === "/summer-quest-2026/" &&
            developerDisabled.window.SummerQuestAnalyticsDebug === undefined
        );

        const forbiddenFields = [
          "photo", "photos", "caption", "reflection", "name", "email",
          "location", "locationName", "preciseLocation", "latitude", "longitude",
          "mediaId", "blobUrl", "keepsakeImage", "feedbackMessage", "message", "metadata"
        ];
        check(
          "No personal or media data crosses the analytics boundary",
          freshPayloads.every(payload => forbiddenFields.every(field => !Object.hasOwn(payload, field)))
        );

        const firstQuestPayload = freshPayloads.find(
          payload => payload.eventName === "quest_completed" && payload.questId === "first"
        );
        check(
          "Quest completion payload exactly preserves anonymous gameplay fields",
          firstQuestPayload?.questTitle === "First Quest" &&
            firstQuestPayload?.completedAt === privateSubmission.completedAt &&
            firstQuestPayload?.adventureDate === privateSubmission.adventureDate &&
            firstQuestPayload?.points === 17 &&
            firstQuestPayload?.friendCount === 2 &&
            firstQuestPayload?.bonusEarned === true &&
            firstQuestPayload?.bonusCount === 1 &&
            JSON.stringify(firstQuestPayload?.bonusIds) === JSON.stringify(["bonus"]),
          firstQuestPayload
        );
        const adventurePayload = freshPayloads.find(
          payload => payload.eventName === "adventure_completed"
        );
        check(
          "Adventure completion payload contains final anonymous totals",
          adventurePayload?.totalCompletedQuests === 2 &&
            adventurePayload?.totalPoints === 42 &&
            adventurePayload?.totalFriends === 2 &&
            adventurePayload?.finalRank === "Summer Legend" &&
            adventurePayload?.completedAt === finalSubmission.completedAt,
          adventurePayload
        );
        check(
          "Feature and Source values are populated for every event",
          freshPayloads.every(payload => typeof payload.feature === "string" && payload.feature &&
            typeof payload.source === "string" && payload.source)
        );

        const secondSession = createHarness({ store: fresh.store, randomSeed: 20 });
        secondSession.api.init(questContext(freshState, { hadStoredAppState: true }));
        secondSession.api.trackJournalOpened();
        secondSession.api.trackJournalOpened();
        const secondSessionPayloads = await secondSession.payloads();
        const secondSessionCounts = countEvents(secondSessionPayloads);
        check(
          "Session events reset per session while first events remain installation-deduped",
          secondSessionCounts.app_opened === 1 &&
            secondSessionCounts.journal_opened === 1 &&
            !secondSessionCounts.app_first_opened &&
            !secondSessionCounts.journal_first_opened,
          secondSessionCounts
        );
        check(
          "Session IDs change while the installation ID remains stable",
          secondSessionPayloads[0]?.installationId === freshPayloads[0]?.installationId &&
            secondSessionPayloads[0]?.sessionId !== freshPayloads[0]?.sessionId
        );
        const freshDedupe = JSON.parse(
          fresh.store.get("summerQuestAnalyticsDedupe") || "{}"
        );
        check(
          "Persistent dedupe entries contain valid timestamps",
          Object.values(freshDedupe).every(value => !Number.isNaN(Date.parse(value))),
          freshDedupe
        );

        const historicalStore = new Map([
          ["summerQuestInstallationId", "SQ-ABCDEF12"],
          ["summerQuestAnalyticsEvidenceV1", JSON.stringify({
            app_installed: { timestamp: "2026-07-01T10:00:00.000Z", source: "browser_install_event" },
            journal_first_opened: { timestamp: "2026-07-02T10:00:00.000Z", source: "journal_navigation" },
            keepsake_first_opened: { timestamp: "2026-07-03T10:00:00.000Z", source: "keepsake_navigation" },
            keepsake_generated: { timestamp: "2026-07-04T10:00:00.000Z", source: "keepsake_generation" },
            privacy_opened: { timestamp: "2026-07-05T10:00:00.000Z", source: "privacy_dialog" },
            feedback_submitted: { timestamp: "2026-07-06T10:00:00.000Z", source: "formspree_success" }
          })]
        ]);
        const historicalState = {
          submissions: { first: privateSubmission, final: finalSubmission }
        };
        const historical = createHarness({
          store: historicalStore,
          runTimers: true,
          randomSeed: 30
        });
        historical.api.init(questContext(historicalState, { hadStoredAppState: true }));
        await new Promise(resolve => window.setTimeout(resolve, 180));
        const historicalPayloads = await historical.payloads();
        const historicalEvents = historicalPayloads.filter(payload => payload.historical === true);
        const historicalCounts = countEvents(historicalEvents);
        check(
          "Existing installation backfills every recoverable historical event once",
          historicalCounts.app_first_opened === 1 &&
            historicalCounts.app_installed === 1 &&
            historicalCounts.quest_completed === 2 &&
            historicalCounts.first_quest_completed === 1 &&
            historicalCounts.adventure_completed === 1 &&
            historicalCounts.journal_first_opened === 1 &&
            historicalCounts.keepsake_first_opened === 1 &&
            historicalCounts.keepsake_generated === 1 &&
            historicalCounts.privacy_opened === 1 &&
            historicalCounts.feedback_submitted === 1 &&
            !historicalCounts.app_opened &&
            !historicalCounts.journal_opened,
          historicalCounts
        );
        check(
          "Historical quest and adventure payloads retain their original values",
          historicalEvents.some(payload =>
            payload.eventName === "quest_completed" &&
            payload.questId === "first" &&
            payload.completedAt === privateSubmission.completedAt &&
            payload.bonusCount === 1 &&
            JSON.stringify(payload.bonusIds) === JSON.stringify(["bonus"])
          ) && historicalEvents.some(payload =>
            payload.eventName === "adventure_completed" &&
            payload.completedAt === finalSubmission.completedAt &&
            payload.totalPoints === 42
          )
        );
        check(
          "Permanent v1.0 backfill marker is written only after completion",
          historicalStore.get("summerQuestAnalyticsBackfillV1") === "1.1"
        );

        const historicalRefresh = createHarness({
          store: historicalStore,
          runTimers: true,
          randomSeed: 60
        });
        historicalRefresh.api.init(questContext(historicalState, { hadStoredAppState: true }));
        historicalRefresh.api.trackJournalOpened();
        historicalRefresh.api.trackJournalOpened();
        await new Promise(resolve => window.setTimeout(resolve, 40));
        const refreshPayloads = await historicalRefresh.payloads();
        check(
          "Completed backfill never reruns and session events continue normally",
          refreshPayloads.every(payload => payload.historical === false) &&
            countEvents(refreshPayloads).app_opened === 1 &&
            countEvents(refreshPayloads).journal_opened === 1,
          countEvents(refreshPayloads)
        );

        const offlineStore = new Map([
          ["summerQuestInstallationId", "SQ-OFFLINE1"],
          ["summerQuestAnalyticsEvidenceV1", JSON.stringify({
            journal_first_opened: { timestamp: "2026-07-02T10:00:00.000Z", source: "journal_navigation" }
          })]
        ]);
        const offline = createHarness({ store: offlineStore, online: false, runTimers: true });
        offline.api.init(questContext({ submissions: { first: privateSubmission } }, {
          hadStoredAppState: true
        }));
        await new Promise(resolve => window.setTimeout(resolve, 30));
        check(
          "Offline existing installation sends nothing and does not complete backfill",
          (await offline.payloads()).length === 0 &&
            !offlineStore.has("summerQuestAnalyticsBackfillV1")
        );
        const onlineRetry = createHarness({ store: offlineStore, runTimers: true, randomSeed: 80 });
        onlineRetry.api.init(questContext({ submissions: { first: privateSubmission } }, {
          hadStoredAppState: true
        }));
        await new Promise(resolve => window.setTimeout(resolve, 100));
        check(
          "Offline backfill retries on a future online launch",
          (await onlineRetry.payloads()).some(payload => payload.historical === true) &&
            offlineStore.get("summerQuestAnalyticsBackfillV1") === "1.1"
        );

        const failedBackfillStore = new Map([
          ["summerQuestInstallationId", "SQ-FAILED12"]
        ]);
        const failedBackfill = createHarness({
          store: failedBackfillStore,
          runTimers: true,
          fetchRejects: true,
          randomSeed: 100
        });
        failedBackfill.api.init(questContext({ submissions: { first: privateSubmission } }, {
          hadStoredAppState: true
        }));
        await new Promise(resolve => window.setTimeout(resolve, 50));
        check(
          "Failed historical upload does not persist completion or event progress",
          !failedBackfillStore.has("summerQuestAnalyticsBackfillV1") &&
            !JSON.parse(failedBackfillStore.get("summerQuestAnalyticsDedupe") || "{}")
              ["historical:app_first_opened"]
        );

        const partialStore = new Map([
          ["summerQuestInstallationId", "SQ-PARTIAL1"]
        ]);
        const partialFailure = createHarness({
          store: partialStore,
          runTimers: true,
          fetchRejectOn: 2,
          randomSeed: 110
        });
        partialFailure.api.init(questContext({ submissions: { first: privateSubmission } }, {
          hadStoredAppState: true
        }));
        await new Promise(resolve => window.setTimeout(resolve, 120));
        const partialFirstPayloads = await partialFailure.payloads();
        const partialRetry = createHarness({
          store: partialStore,
          runTimers: true,
          randomSeed: 120
        });
        partialRetry.api.init(questContext({ submissions: { first: privateSubmission } }, {
          hadStoredAppState: true
        }));
        await new Promise(resolve => window.setTimeout(resolve, 100));
        const partialCombined = [
          ...partialFirstPayloads,
          ...(await partialRetry.payloads())
        ].filter(payload => payload.historical === true);
        check(
          "Partial backfill resumes without duplicating successful historical rows",
          countEvents(partialCombined).app_first_opened === 1 &&
            countEvents(partialCombined).quest_completed === 1 &&
            partialStore.get("summerQuestAnalyticsBackfillV1") === "1.1",
          countEvents(partialCombined)
        );

        const standaloneStore = new Map([
          ["summerQuestInstallationId", "SQ-STAND123"]
        ]);
        const standaloneHistory = createHarness({
          store: standaloneStore,
          standalone: true,
          runTimers: true,
          randomSeed: 130
        });
        standaloneHistory.api.init(questContext({ submissions: {} }, {
          hadStoredAppState: true
        }));
        await new Promise(resolve => window.setTimeout(resolve, 120));
        const standalonePayloads = await standaloneHistory.payloads();
        check(
          "Standalone mode backfills an installation that predates analytics",
          standalonePayloads.some(payload =>
            payload.eventName === "app_installed" &&
            payload.historical === true &&
            payload.source === "standalone_detection"
          ),
          countEvents(standalonePayloads)
        );

        const fallback = createHarness({ beaconAccepted: false });
        fallback.api.init(questContext({ submissions: {} }));
        await Promise.resolve();
        check(
          "Rejected beacon uses exactly one fetch fallback per live event",
          fallback.attempts.beacon === 2 && fallback.attempts.fetch === 2,
          fallback.attempts
        );
        check(
          "Accepted beacon never also invokes fetch",
          fresh.attempts.beacon === freshPayloads.length && fresh.attempts.fetch === 0,
          fresh.attempts
        );

        const failedSend = createHarness({ beaconAccepted: false, fetchThrows: true });
        const failedState = { submissions: { first: privateSubmission } };
        failedSend.api.init(questContext(failedState));
        failedSend.api.trackQuestSaved({
          questId: "first",
          submission: privateSubmission,
          previousCompletedCount: 0,
          wasCompletedBefore: false
        });
        check(
          "Failed live transport initiation does not persist quest dedupe",
          !JSON.parse(failedSend.store.get("summerQuestAnalyticsDedupe") || "{}")
            ["quest_completed:first"]
        );

        const optedOutStore = new Map([
          ["summerQuestAnonymousSharingEnabled", "false"]
        ]);
        const optedOut = createHarness({ store: optedOutStore });
        optedOut.api.init(questContext({ submissions: {} }));
        optedOut.api.trackPrivacyOpened();
        check(
          "Opt-out uploads nothing and creates no installation identifier",
          (await optedOut.payloads()).length === 0 &&
            !optedOutStore.has("summerQuestInstallationId") &&
            optedOutStore.has("summerQuestAnalyticsEvidenceV1")
        );

        const staleMigrationStore = new Map([
          ["summerQuestInstallationId", "d232f08c-eda5-4d08-9c0a-fba807e206e0"],
          ["summerQuestAnalyticsBackfillV1", "1.0"],
          ["summerQuestAnalyticsBackfillStateV2", JSON.stringify({
            version: "1.0",
            status: "completed",
            completed: true,
            completedQuestCount: 1,
            normalizedHistoricalRecordCount: 1
          })],
          ["summerQuestFirstOpenMigrationV1", JSON.stringify({
            version: "1.0",
            status: "completed"
          })],
          ["summerQuestAnalyticsDedupe", JSON.stringify({
            "quest_completed:first": "2026-07-25T12:00:00.000Z",
            "historical_quest_completed:first": "2026-07-25T12:00:00.000Z",
            first_quest_completed: "2026-07-25T12:00:00.000Z",
            "historical:first_quest_completed": "2026-07-25T12:00:00.000Z"
          })]
        ]);
        const staleMigration = createHarness({
          store: staleMigrationStore,
          runTimers: true,
          randomSeed: 145
        });
        staleMigration.api.init(questContext({
          submissions: { first: privateSubmission }
        }, { hadStoredAppState: true }));
        await new Promise(resolve => window.setTimeout(resolve, 100));
        const staleMigrationPayloads = await staleMigration.payloads();
        const repairedMigrationState = JSON.parse(
          staleMigrationStore.get("summerQuestAnalyticsBackfillStateV2") || "{}"
        );
        const repairedMigrationStatus = staleMigration.api.migrationStatus();
        check(
          "Stale migration and dedupe state cannot suppress saved quest repair",
          staleMigrationPayloads.some(payload =>
            payload.historical === true &&
            payload.eventName === "quest_completed" &&
            payload.questId === "first" &&
            payload.eventKey ===
              "d232f08c-eda5-4d08-9c0a-fba807e206e0:quest_completed:first"
          ) &&
            staleMigrationStore.get("summerQuestAnalyticsBackfillV1") === "1.1" &&
            repairedMigrationState.status === "completed" &&
            repairedMigrationState.completed === true &&
            repairedMigrationState.lastReceiverStatus === 200 &&
            repairedMigrationState.deployedReceiverVersion === "8" &&
            repairedMigrationState.recordsQueued === repairedMigrationState.recordsUploaded &&
            repairedMigrationStatus.pendingQueueCount === 0 &&
            repairedMigrationStatus.completedSubmissionCount === 1,
          { repairedMigrationState, repairedMigrationStatus }
        );

        const staleDedupeStore = new Map([
          ["summerQuestInstallationId", "SQ-STALE123"],
          ["summerQuestAnalyticsBackfillV1", "1.0"],
          ["summerQuestAnalyticsDedupe", JSON.stringify({
            mission_briefing_completed: "old",
            "quest_opened:first": "old",
            "finale_animation_started:key": "old",
            app_first_opened: "keep"
          })]
        ]);
        createHarness({ store: staleDedupeStore }).api.init(
          questContext({ submissions: {} }, { hadStoredAppState: true })
        );
        const cleanedDedupe = JSON.parse(staleDedupeStore.get("summerQuestAnalyticsDedupe"));
        check(
          "Obsolete event dedupe entries are pruned while v1.0 entries remain",
          Object.keys(cleanedDedupe).join(",") === "app_first_opened",
          cleanedDedupe
        );

        const productionSources = `${analyticsSource}\n${appSource}\n${journalSource}`;
        const removedEvents = [
          "mission_briefing_completed",
          "quest_opened",
          "contact_opened",
          "install_help_opened",
          "finale_animation_started",
          "finale_animation_completed"
        ];
        check(
          "Removed and non-spec analytics events have no production definitions or callers",
          removedEvents.every(eventName => !productionSources.includes(eventName)),
          removedEvents.filter(eventName => productionSources.includes(eventName))
        );

        const submitBranchStart = appSource.indexOf('els.form.addEventListener("submit"');
        const submitBranch = appSource.slice(
          submitBranchStart,
          appSource.indexOf("const obsoleteMediaIds", submitBranchStart)
        );
        check(
          "Quest analytics follows successful local state persistence",
          submitBranchStart >= 0 &&
            submitBranch.indexOf("save();") >= 0 &&
            submitBranch.indexOf("analyticsSync?.trackQuestSaved") > submitBranch.indexOf("save();") &&
            submitBranch.includes("wasCompletedBefore")
        );
        const feedbackSuccess = appSource.slice(
          appSource.indexOf("const response = await fetch(CONTACT_FORM_ENDPOINT"),
          appSource.indexOf("} catch (error)", appSource.indexOf("const response = await fetch(CONTACT_FORM_ENDPOINT"))
        );
        check(
          "Feedback analytics follows a successful Formspree response and receives no message",
          feedbackSuccess.indexOf("if (!response.ok)") >= 0 &&
            feedbackSuccess.indexOf("trackFeedbackSubmitted?.()") >
              feedbackSuccess.indexOf("if (!response.ok)") &&
            !feedbackSuccess.includes("trackFeedbackSubmitted?.(els.")
        );
        check(
          "Journal and keepsake trigger locations use the explicit v1.0 API",
          journalSource.includes("trackJournalOpened?.()") &&
            journalSource.includes("trackKeepsakeOpened?.()") &&
            journalSource.includes("trackKeepsakeGenerated?.()")
        );
        check(
          "Only the native appinstalled event records installation",
          analyticsSource.includes('addEventListener("appinstalled"') &&
            !appSource.includes("trackAppInstalled")
        );
        check(
          "Board reset cannot reset analytics identity or dedupe",
          !appSource.includes("trackBoardReset") &&
            !analyticsSource.includes("resetInstallation")
        );
        const analyticsInitStart = appSource.indexOf(
          "function initializeAnalyticsSync()"
        );
        const analyticsInitBlock = appSource.slice(
          analyticsInitStart,
          appSource.indexOf("function renderPrivacySharingStatus()", analyticsInitStart)
        );
        const initializeAppStart = appSource.indexOf("async function initializeApp()");
        const initializeAppBlock = appSource.slice(
          initializeAppStart,
          appSource.indexOf("if (new URLSearchParams", initializeAppStart)
        );
        check(
          "Analytics initialization failure is isolated from core app startup",
          analyticsInitStart >= 0 &&
            analyticsInitBlock.includes("try {") &&
            analyticsInitBlock.includes("catch (error)") &&
            analyticsInitBlock.includes("gameplay remains available") &&
            initializeAppStart >= 0 &&
            initializeAppBlock.indexOf("initializeAnalyticsSync();") <
              initializeAppBlock.indexOf("renderGrid();")
        );

        const receiverApi = new Function(
          `${receiverSource}\nreturn { version: RECEIVER_VERSION, headers: ANALYTICS_HEADERS, values: analyticsValues, ensure: ensureAnalyticsHeaders, writeRow: writeAnalyticsRow, isTest: analyticsPayloadIsTest, sheetName: analyticsSheetName, expectedSecret: analyticsExpectedSecret, missingFields: analyticsMissingPayloadFields };`
        )();
        const receiverValues = receiverApi.values(firstQuestPayload);
        check(
          "Apps Script receiver maps the complete v1.0 contract",
          receiverApi.version === "8" &&
          receiverApi.headers[0] === "Received At" &&
          !Number.isNaN(Date.parse(receiverValues["Received At"])) &&
          [
            "Bonus Count", "Bonus IDs", "Historical", "Feature", "Source",
            "Environment", "Is Test"
          ].every(header => receiverApi.headers.includes(header)) &&
            receiverValues["Bonus Count"] === 1 &&
            receiverValues["Bonus IDs"] === "bonus" &&
            receiverValues.Historical === false &&
            receiverValues.Feature === "gameplay" &&
            receiverValues.Source === "quest_save" &&
            receiverValues.Environment === "development" &&
            receiverValues["Is Test"] === true
        );
        const sheetProperties = values => ({
          getProperty(name) {
            return values[name] || null;
          }
        });
        check(
          "Receiver routes only explicit test payloads to the testing sheet",
          receiverApi.sheetName(
            { environment: "development", is_test: true },
            sheetProperties({})
          ) === "Analytics Testing" &&
            receiverApi.sheetName(
              { environment: "development", is_test: true },
              sheetProperties({ ANALYTICS_TEST_SHEET_NAME: "QA Events" })
            ) === "QA Events" &&
            receiverApi.sheetName({}, sheetProperties({})) === "Events" &&
            receiverApi.isTest({ is_test: "true" }) === false
        );
        check(
          "Receiver defaults normal gameplay to one obvious production sheet",
          receiverApi.sheetName(
            { environment: "beta", is_test: false },
            sheetProperties({})
          ) === "Events" &&
            receiverApi.sheetName(
              { environment: "beta", is_test: false },
              sheetProperties({ ANALYTICS_SHEET_NAME: "Beta Events" })
            ) === "Beta Events" &&
            receiverApi.isTest({ environment: "beta", is_test: true }) === true &&
            receiverApi.isTest({ environment: "development", is_test: false }) === false
        );
        check(
          "Missing Script Property falls back to the current client secret",
          receiverApi.expectedSecret(sheetProperties({})).secret ===
            "sq_8Fz3mQ7pL2xN9vK4cR6tY1wX5bD8eM" &&
            receiverApi.expectedSecret(sheetProperties({})).source === "fallback_constant" &&
            receiverApi.expectedSecret(
              sheetProperties({ ANALYTICS_SECRET: "configured-secret" })
            ).secret === "configured-secret"
        );
        check(
          "Receiver requires only the core event identity and timestamp fields",
          receiverApi.missingFields({
            installationId: "SQ-TEST",
            eventName: "app_opened",
            timestamp: "2026-08-05T20:00:00.000Z"
          }).length === 0 &&
            receiverApi.missingFields({ eventName: "app_opened" }).join(",") ===
              "installationId,timestamp"
        );
        check(
          "Receiver preserves leading-zero legacy and current build formats",
          (() => {
            const formats = [];
            const scalarValues = [];
            const sheet = {
              getRange(row, column) {
                return {
                  setValues() {
                    return this;
                  },
                  setNumberFormat(format) {
                    formats.push({ row, column, format });
                    return this;
                  },
                  setValue(value) {
                    scalarValues.push({ row, column, value });
                    return this;
                  }
                };
              }
            };
            receiverApi.writeRow(sheet, 2, ["Event Name", "Build"], ["app_opened", "08060"]);
            receiverApi.writeRow(sheet, 3, ["Event Name", "Build"], ["app_opened", "080502"]);
            return formats.map(item => item.format).join(",") === "00000,000000" &&
              scalarValues.map(item => item.value).join(",") === "8060,80502";
          })()
        );
        check(
          "Receiver preserves existing rows while appending missing headers",
          (() => {
            const rows = [
              ["Event Name", "Legacy Column"],
              ["app_opened", "preserve me"]
            ];
            const originalDataRow = JSON.stringify(rows[1]);
            const sheet = {
              getLastColumn: () => rows[0].length,
              getLastRow: () => rows.length,
              getRange(row, column, rowCount, columnCount) {
                return {
                  getValues: () => Array.from({ length: rowCount }, (_, rowOffset) =>
                    Array.from({ length: columnCount }, (_, columnOffset) =>
                      rows[row - 1 + rowOffset]?.[column - 1 + columnOffset] ?? ""
                    )
                  ),
                  setValues(values) {
                    values.forEach((valueRow, rowOffset) => {
                      rows[row - 1 + rowOffset] ||= [];
                      valueRow.forEach((value, columnOffset) => {
                        rows[row - 1 + rowOffset][column - 1 + columnOffset] = value;
                      });
                    });
                  }
                };
              }
            };
            const headers = receiverApi.ensure(sheet);
            return JSON.stringify(rows[1]) === originalDataRow &&
              headers.slice(0, 2).join(",") === "Event Name,Legacy Column" &&
              [
                "Bonus Count", "Bonus IDs", "Historical", "Feature", "Source",
                "Environment", "Is Test"
              ]
                .every(header => headers.includes(header));
          })()
        );

        let blockedStorageThrew = false;
        try {
          const blocked = createHarness({ storageThrows: true });
          blocked.api.init(questContext({ submissions: {} }));
          blocked.api.trackPrivacyOpened();
          blocked.api.debugState();
        } catch {
          blockedStorageThrew = true;
        }
        check("Blocked browser storage never interrupts gameplay", !blockedStorageThrew);

        const observerHarness = createHarness();
        observerHarness.api.onStatusChange(() => {
          throw new Error("observer failure");
        });
        let observerThrew = false;
        try {
          observerHarness.api.init(questContext({ submissions: {} }));
        } catch {
          observerThrew = true;
        }
        check("Analytics observers cannot interrupt gameplay", !observerThrew);

        const failed = checks.filter(item => !item.passed);
        result.textContent = JSON.stringify({
          status: failed.length ? "FAIL" : "PASS",
          buildVersion,
          passed: checks.length - failed.length,
          failed: failed.length,
          checks
        }, null, 2);
      } catch (error) {
        result.textContent = JSON.stringify({
          status: "ERROR",
          message: error.message,
          stack: error.stack
        }, null, 2);
      }
    })();
  </script>
</body>
</html>
