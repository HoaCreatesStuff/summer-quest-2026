<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Summer Quest PWA Update Validation</title>
</head>
<body>
  <h1>Summer Quest PWA update validation</h1>
  <pre id="result">Running…</pre>

  <script src="../version.js"></script>
  <script>
    (async () => {
      const result = document.querySelector("#result");
      const checks = [];
      const buildVersion = globalThis.SUMMER_QUEST_BUILD?.version;
      const testStorageKey = "summer-quest-pwa-validation";
      const testDatabaseName = "summer-quest-pwa-validation";
      const legacyWorkerVersion = "080901";
      const oldCacheName = "summer-quest-app-previous-test";
      const unrelatedCacheName = "unrelated-cache-validation";

      function check(name, condition, details = "") {
        checks.push({ name, passed: Boolean(condition), details });
      }

      function waitForWorkerState(worker, state) {
        if (!worker || worker.state === state) return Promise.resolve();

        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            reject(new Error(`Worker did not reach ${state}`));
          }, 10000);

          worker.addEventListener("statechange", () => {
            if (worker.state !== state) return;
            window.clearTimeout(timeout);
            resolve();
          });
        });
      }

      async function activateWorkerForValidation(registration, worker) {
        if (worker?.state === "installing") {
          await waitForWorkerState(worker, "installed");
        }

        const waitingWorker =
          registration.waiting ||
          (worker?.state === "installed" ? worker : null);
        waitingWorker?.postMessage({ type: "SUMMER_QUEST_SKIP_WAITING" });
        await waitForWorkerState(waitingWorker || worker, "activated");
      }

      function openTestDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(testDatabaseName, 1);
          request.onupgradeneeded = () => {
            request.result.createObjectStore("sentinels");
          };
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
        });
      }

      function writeDatabaseSentinel(database) {
        return new Promise((resolve, reject) => {
          const transaction = database.transaction("sentinels", "readwrite");
          transaction.objectStore("sentinels").put("preserved", "progress");
          transaction.onerror = () => reject(transaction.error);
          transaction.oncomplete = resolve;
        });
      }

      function readDatabaseSentinel(database) {
        return new Promise((resolve, reject) => {
          const transaction = database.transaction("sentinels", "readonly");
          const request = transaction.objectStore("sentinels").get("progress");
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
        });
      }

      function deleteTestDatabase() {
        return new Promise(resolve => {
          const request = indexedDB.deleteDatabase(testDatabaseName);
          request.onerror = resolve;
          request.onsuccess = resolve;
          request.onblocked = resolve;
        });
      }

      function waitForController() {
        if (navigator.serviceWorker.controller) {
          return Promise.resolve(navigator.serviceWorker.controller);
        }

        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            reject(new Error("Service worker did not claim this page"));
          }, 10000);

          navigator.serviceWorker.addEventListener("controllerchange", () => {
            window.clearTimeout(timeout);
            resolve(navigator.serviceWorker.controller);
          }, { once: true });
        });
      }

      function requestWorkerVersion(controller) {
        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            reject(new Error("Worker version response timed out"));
          }, 5000);

          function handleMessage(event) {
            if (event.data?.type !== "SUMMER_QUEST_SW_VERSION") return;
            window.clearTimeout(timeout);
            navigator.serviceWorker.removeEventListener("message", handleMessage);
            resolve(event.data.version);
          }

          navigator.serviceWorker.addEventListener("message", handleMessage);
          controller.postMessage({ type: "SUMMER_QUEST_GET_VERSION" });
        });
      }

      async function waitForControllerVersion(expectedVersion) {
        const deadline = Date.now() + 10000;
        while (Date.now() < deadline) {
          const controller = navigator.serviceWorker.controller;
          const version = await requestWorkerVersion(controller).catch(() => null);
          if (version === expectedVersion) return controller;
          await new Promise(resolve => window.setTimeout(resolve, 50));
        }
        throw new Error(`Controller did not advance to ${expectedVersion}`);
      }

      function loadAppFrame(url) {
        return new Promise((resolve, reject) => {
          const frame = document.createElement("iframe");
          frame.hidden = true;
          const timeout = window.setTimeout(() => {
            frame.remove();
            reject(new Error(`App-shell navigation timed out: ${url}`));
          }, 10000);
          frame.addEventListener("load", () => {
            const waitForApp = () => {
              const ready =
                !frame.contentWindow.location.search.includes("developer=") &&
                frame.contentDocument
                  .querySelector('meta[name="application-version"]')?.content ===
                    buildVersion &&
                frame.contentDocument
                  .querySelectorAll("#questGrid [data-quest-id]").length === 25;
              if (ready) {
                window.clearTimeout(timeout);
                resolve(frame);
                return;
              }
              window.setTimeout(waitForApp, 50);
            };
            waitForApp();
          }, { once: true });
          frame.src = url;
          document.body.append(frame);
        });
      }

      try {
        const [indexSource, versionSource, workerSource, updaterSource, manifest] =
          await Promise.all([
            fetch("../index.html", { cache: "no-store" }).then(response => response.text()),
            fetch("../version.js", { cache: "no-store" }).then(response => response.text()),
            fetch("../sw.js", { cache: "no-store" }).then(response => response.text()),
            fetch("../data/pwa.js", { cache: "no-store" }).then(response => response.text()),
            fetch("../manifest.json", { cache: "no-store" }).then(response => response.json())
          ]);

        const indexDocument = new DOMParser().parseFromString(
          indexSource,
          "text/html"
        );
        const applicationVersionMeta = indexDocument
          .querySelector('meta[name="application-version"]')
          ?.getAttribute("content");
        const footerBuildElement = indexDocument.querySelector("#footerBuildText");
        const duplicatedBuildPattern = /(?:\b\d{5,6}\b|\b\d{4}\.\d{2}\.\d{2}\.\d+\b)/;
        const workerGeneratedBuild = workerSource.match(
          /const GENERATED_WORKER_VERSION = "(\d{6})";/
        )?.[1];
        const workerCacheName = workerSource.match(
          /const CACHE_NAME = "(summer-quest-app-\d{6})";/
        )?.[1];

        check(
          "version.js defines one valid MMDDNN build value",
          /^\d{6}$/.test(buildVersion || "") &&
            /const BUILD_VERSION = "\d{6}";/.test(versionSource) &&
            versionSource.includes("version: BUILD_VERSION") &&
            globalThis.SUMMER_QUEST_BUILD?.isValid?.(buildVersion),
          buildVersion
        );
        check(
          "MMDDNN builds compare by date and daily release number",
          globalThis.SUMMER_QUEST_BUILD?.compare?.("080501", "080502") === -1 &&
            globalThis.SUMMER_QUEST_BUILD?.compare?.("080502", "080502") === 0 &&
            globalThis.SUMMER_QUEST_BUILD?.compare?.("080503", "080502") === 1 &&
            globalThis.SUMMER_QUEST_BUILD?.compare?.("080504", "080601") === -1 &&
            globalThis.SUMMER_QUEST_BUILD?.isValid?.("080600") === false
        );
        check(
          "HTML metadata and asset URLs are populated from version.js",
          applicationVersionMeta === "" &&
            versionSource.includes('meta[name="application-version"]') &&
            indexSource.includes('SUMMER_QUEST_BUILD.assetUrl("style.css")') &&
            indexSource.includes('SUMMER_QUEST_BUILD.assetUrl("./manifest.json")') &&
            indexSource.includes('versioned("data/app.js")'),
          { applicationVersionMeta, startUrl: manifest.start_url }
        );
        check(
          "Footer renders its build through the shared data hook",
          footerBuildElement?.textContent.trim() === "Build" &&
            footerBuildElement?.tagName === "SPAN" &&
            Boolean(footerBuildElement?.querySelector("[data-build-version]")) &&
            versionSource.includes('[data-build-version]')
        );
        check(
          "HTML, manifest, and updater contain no manually duplicated build literal",
          !duplicatedBuildPattern.test(indexSource) &&
            !duplicatedBuildPattern.test(JSON.stringify(manifest)) &&
            !duplicatedBuildPattern.test(updaterSource) &&
            !manifest.start_url.includes("build=")
        );
        check(
          "Update notice uses the release copy and exposes a Restart action",
          indexDocument.querySelector("#pwaUpdateNotice")?.textContent.includes(
            "A new version is available. Restart to update."
          ) &&
            indexDocument.querySelector("#pwaUpdateButton")?.textContent.trim() ===
              "Restart"
        );
        check(
          "Worker uses versioned caches and removes only obsolete app caches",
          workerSource.includes('const CACHE_PREFIX = "summer-quest-app-"') &&
            workerGeneratedBuild === buildVersion &&
            workerCacheName === `summer-quest-app-${buildVersion}` &&
            workerSource.includes("self.SUMMER_QUEST_BUILD?.version") &&
            workerSource.includes("self.SUMMER_QUEST_BUILD?.isValid") &&
            workerSource.includes("WORKER_VERSION") &&
            workerSource.includes("name.startsWith(CACHE_PREFIX)") &&
            workerSource.includes("name !== CACHE_NAME")
        );
        check(
          "App shell precaches the current journal hero and excludes its obsolete path",
          workerSource.includes('"./assets/hero-summer-journal.png"') &&
            !workerSource.includes("hero-journal-new.png")
        );
        check(
          "Worker activates a fully cached shell with clients.claim and skipWaiting",
          workerSource.includes("self.clients.claim()") &&
            workerSource.includes('SUMMER_QUEST_SKIP_WAITING') &&
            workerSource.includes("await cacheAppShell()") &&
            workerSource.includes("await self.skipWaiting()")
        );
        check(
          "Navigations use one canonical app shell while static assets remain cache-first",
          workerSource.includes("APP_SCOPE_PATH") &&
            workerSource.includes("APP_INDEX_PATH") &&
            workerSource.includes('request.mode === "navigate"') &&
            workerSource.includes('cache.match("./index.html"') &&
            workerSource.includes("appShellNavigation(request)") &&
            workerSource.includes("event.respondWith(cacheFirst(request))") &&
            !workerSource.includes('cacheFirst(request, "./index.html")')
        );
        check(
          "Registration bypasses the HTTP cache and checks automatically",
          updaterSource.includes('updateViaCache: "none"') &&
            updaterSource.includes("encodeURIComponent(buildVersion)") &&
            updaterSource.includes("registration.update()") &&
            updaterSource.includes('"updatefound"') &&
            updaterSource.includes('"visibilitychange"') &&
            !updaterSource.includes("!registration || !navigator.onLine")
        );
        const registrations = updaterSource.match(/serviceWorker\.register\(/g) || [];
        const updateFoundListeners = updaterSource.match(/addEventListener\("updatefound"/g) || [];
        const controllerChangeListeners = updaterSource.match(/addEventListener\("controllerchange"/g) || [];
        const reloadCalls = updaterSource.match(/window\.location\.reload\(\)/g) || [];
        const skipWaitingMessages = updaterSource.match(/type: "SUMMER_QUEST_SKIP_WAITING"/g) || [];

        check(
          "One coordinator owns registration and update lifecycle listeners",
          registrations.length === 1 &&
            updateFoundListeners.length === 1 &&
            controllerChangeListeners.length === 1,
          {
            registrations: registrations.length,
            updateFoundListeners: updateFoundListeners.length,
            controllerChangeListeners: controllerChangeListeners.length
          }
        );
        check(
          "Update flow guards one Restart action and one automatic controller-owned reload",
          updaterSource.includes("restartInProgress") &&
            updaterSource.includes("isReloadingForUpdate") &&
            updaterSource.includes("waitingWorker.postMessage") &&
            reloadCalls.length === 2 &&
            skipWaitingMessages.length === 1,
          { reloadCalls: reloadCalls.length, skipWaitingMessages: skipWaitingMessages.length }
        );
        check(
          "Waiting and active builds are compared before prompting",
          updaterSource.includes("LAST_ACTIVE_BUILD_KEY") &&
            updaterSource.includes("compareBuildVersions") &&
            updaterSource.includes("buildsMatch(waitingVersion, activeVersion)") &&
            updaterSource.includes("buildsMatch(waitingVersion, lastActiveVersion)") &&
            workerSource.includes("event.ports?.[0]")
        );
        check(
          "Automatic controller handoff reloads only a newer shell",
          updaterSource.includes("compareBuildVersions?.(activeVersion, buildVersion) !== 1") &&
            updaterSource.includes("isReloadingForUpdate")
        );
        check(
          "PWA updater never clears player storage or databases",
          !workerSource.includes("localStorage") &&
            !workerSource.includes("indexedDB") &&
            !updaterSource.includes("localStorage.clear") &&
            !updaterSource.includes("indexedDB.deleteDatabase")
        );

        if (!("serviceWorker" in navigator)) {
          check(
            "Browser supports the service-worker verification",
            false,
            "Service workers unavailable"
          );
        } else {
          localStorage.setItem(testStorageKey, "preserved");
          const database = await openTestDatabase();
          await writeDatabaseSentinel(database);
          database.close();

          const oldCache = await caches.open(oldCacheName);
          await oldCache.put(
            new Request("../tests/old-cache-sentinel"),
            new Response("old")
          );
          const unrelatedCache = await caches.open(unrelatedCacheName);
          await unrelatedCache.put(
            new Request("../tests/unrelated-cache-sentinel"),
            new Response("unrelated")
          );

          // Test A: run a real older controller, then replace it with the
          // current worker. The legacy worker is scoped only to /tests/.
          const legacyRegistration = await navigator.serviceWorker.register(
            "./legacy-080901-worker.js",
            { scope: "./", updateViaCache: "none" }
          );
          await activateWorkerForValidation(
            legacyRegistration,
            legacyRegistration.installing || legacyRegistration.waiting || legacyRegistration.active
          );
          await waitForControllerVersion(legacyWorkerVersion);
          const legacyCacheNames = await caches.keys();

          const upgradeRegistration = await navigator.serviceWorker.register(
            `../sw.js?v=${encodeURIComponent(buildVersion)}&upgrade-validation=${Date.now()}`,
            { scope: "./", updateViaCache: "none" }
          );
          const upgradedController = await waitForControllerVersion(buildVersion);
          // `controllerchange` can precede completion of the activate event's
          // waitUntil work. Give cache cleanup its final event turn before
          // checking the old cache name.
          await new Promise(resolve => window.setTimeout(resolve, 100));
          const upgradedCacheNames = await caches.keys();
          const legacyShellResponse = await fetch("./legacy-shell");
          const upgradeDatabase = await openTestDatabase();
          const upgradeDatabaseSentinel = await readDatabaseSentinel(upgradeDatabase);
          upgradeDatabase.close();

          check(
            "080901 controller is replaced automatically and no longer serves its shell",
            legacyCacheNames.includes(`summer-quest-app-${legacyWorkerVersion}`) &&
              upgradeRegistration.active === upgradedController &&
              legacyShellResponse.status === 404,
            {
              legacyCacheNames,
              upgradedCacheNames,
              legacyShellStatus: legacyShellResponse.status
            }
          );
          check(
            "080901-to-current handoff preserves local progress",
            localStorage.getItem(testStorageKey) === "preserved" &&
              upgradeDatabaseSentinel === "preserved",
            { databaseSentinel: upgradeDatabaseSentinel }
          );

          const registration = await navigator.serviceWorker.register(
            `../sw.js?v=${encodeURIComponent(buildVersion)}&validation=${Date.now()}`,
            {
              scope: "../",
              updateViaCache: "none"
            }
          );
          const worker =
            registration.installing ||
            registration.waiting ||
            registration.active;
          await activateWorkerForValidation(registration, worker);
          const controller = await waitForController();
          const workerVersion = await requestWorkerVersion(controller);
          const expectedCacheName = `summer-quest-app-${workerVersion}`;
          const cacheNames = await caches.keys();
          const currentCache = await caches.open(expectedCacheName);
          const cachedAnalytics = await currentCache.match(
            new URL("../data/analytics.js", window.location.href).href
          );
          const cachedJournalHero = await currentCache.match(
            new URL("../assets/hero-summer-journal.png", window.location.href).href
          );
          const preservedDatabase = await openTestDatabase();
          const databaseSentinel = await readDatabaseSentinel(preservedDatabase);
          preservedDatabase.close();

          const previousDeveloperMode = localStorage.getItem("summerQuestDeveloperMode");
          const expectedAppPath = new URL("../", window.location.href).pathname;
          const developerFrame = await loadAppFrame(
            "../?developer=true&pwa-cache-validation=1#journal"
          );
          const developerFrameState = {
            pathname: developerFrame.contentWindow.location.pathname,
            search: developerFrame.contentWindow.location.search,
            hash: developerFrame.contentWindow.location.hash,
            build: developerFrame.contentDocument
              .querySelector('meta[name="application-version"]')?.content,
            boardCount: developerFrame.contentDocument
              .querySelectorAll("#questGrid [data-quest-id]").length
          };
          developerFrame.remove();
          const cacheRequests = await currentCache.keys();
          const developerCacheEntries = cacheRequests.filter(request =>
            new URL(request.url).searchParams.has("developer")
          );
          if (previousDeveloperMode === null) {
            localStorage.removeItem("summerQuestDeveloperMode");
          } else {
            localStorage.setItem("summerQuestDeveloperMode", previousDeveloperMode);
          }

          check(
            "Installed worker reports the current internal worker build",
            workerVersion === buildVersion,
            { workerVersion, publicBuildVersion: buildVersion }
          );
          check(
            "Activation creates the current cache and removes the old app cache",
            cacheNames.includes(expectedCacheName) &&
              !cacheNames.includes(oldCacheName),
            cacheNames
          );
          check(
            "Current release cache includes analytics.js",
            Boolean(cachedAnalytics),
            expectedCacheName
          );
          check(
            "Current release cache includes the journal hero",
            Boolean(cachedJournalHero),
            expectedCacheName
          );
          check(
            "Developer Mode navigation reuses the canonical shell without path loss or cache variants",
            developerFrameState.pathname === expectedAppPath &&
              developerFrameState.search === "?pwa-cache-validation=1" &&
              developerFrameState.hash === "#journal" &&
              developerFrameState.build === buildVersion &&
              developerFrameState.boardCount === 25 &&
              developerCacheEntries.length === 0,
            { developerFrameState, developerCacheEntries }
          );
          check(
            "Activation preserves unrelated origin caches",
            cacheNames.includes(unrelatedCacheName),
            cacheNames
          );
          check(
            "Activation preserves localStorage progress",
            localStorage.getItem(testStorageKey) === "preserved"
          );
          check(
            "Activation preserves IndexedDB progress",
            databaseSentinel === "preserved",
            databaseSentinel
          );

          localStorage.removeItem(testStorageKey);
          await caches.delete(unrelatedCacheName);
          await deleteTestDatabase();
        }

        const failed = checks.filter(item => !item.passed);
        result.textContent = JSON.stringify({
          status: failed.length === 0 ? "PASS" : "FAIL",
          passed: checks.length - failed.length,
          failed: failed.length,
          checks
        }, null, 2);
      } catch (error) {
        result.textContent = JSON.stringify({
          status: "FAIL",
          name: error.name,
          message: error.message,
          checks
        }, null, 2);
      }
    })();
  </script>
</body>
</html>
