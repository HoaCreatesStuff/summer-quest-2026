<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Summer Quest view media routing validation</title>
  <style>
    #appFrame {
      position: absolute;
      left: -10000px;
      top: 0;
      width: 390px;
      height: 844px;
      border: 0;
    }
  </style>
</head>
<body>
  <h1>Summer Quest view media routing validation</h1>
  <pre id="result">Running…</pre>
  <iframe id="appFrame" title="Summer Quest view media routing test app"></iframe>

  <script>
    (async () => {
      const result = document.querySelector("#result");
      const frame = document.querySelector("#appFrame");
      const checks = [];
      const questId = "bodega-cat";

      const wait = milliseconds =>
        new Promise(resolve => setTimeout(resolve, milliseconds));
      const nextFrame = () =>
        new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const waitFor = async (predicate, message, timeout = 15000) => {
        const deadline = Date.now() + timeout;
        while (Date.now() < deadline) {
          if (await predicate()) return;
          await wait(50);
        }
        throw new Error(message);
      };
      const check = (name, condition, details = "") => {
        checks.push({ name, passed: Boolean(condition), details });
      };

      try {
        const loaded = new Promise(resolve => {
          frame.addEventListener("load", resolve, { once: true });
        });
        frame.src = "../index.html?interaction-accessibility-validation=1&view-media-routing-validation=1";
        await loaded;
        await waitFor(
          () =>
            frame.contentWindow?.SummerQuestInteractionTestHooks &&
            frame.contentDocument?.querySelectorAll("#questGrid [data-quest-id]").length === 25,
          "Timed out waiting for the test app to initialize."
        );

        const app = frame.contentWindow;
        const documentUnderTest = frame.contentDocument;
        const hooks = app.SummerQuestInteractionTestHooks;
        const savedState = () =>
          JSON.parse(app.localStorage.getItem("nyc-summer-quest-mvp-v1") || "{}");
        const homeTile = () =>
          documentUnderTest.querySelector(`#questGrid [data-quest-id="${questId}"]`);

        const openQuest = async () => {
          homeTile().click();
          await waitFor(
            () =>
              !documentUnderTest.querySelector("#questSheet").hidden &&
              documentUnderTest.querySelector("#sheetTitle").textContent === "Bodega Cat",
            "Timed out opening the Bodega Cat quest."
          );
        };

        const cropTestImage = async (color, trigger) => {
          const file = new app.File(
            [
              `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40">` +
                `<rect width="40" height="40" fill="${color}"/>` +
              `</svg>`
            ],
            `routing-${color.replace("#", "")}.svg`,
            { type: "image/svg+xml" }
          );
          hooks.openCropper(file, trigger);
          await waitFor(
            () => documentUnderTest.querySelector(".cropper-container"),
            "Timed out waiting for the cropper."
          );
          documentUnderTest.querySelector("#confirmCrop").click();
          await waitFor(
            () =>
              documentUnderTest.querySelector("#cropModal").hidden &&
              !documentUnderTest.querySelector("#mediaPreview").hidden,
            "Timed out saving the cropped test image."
          );
        };

        const goToBoard = async () => {
          if (!documentUnderTest.querySelector("#keepsakePage").hidden) {
            documentUnderTest.querySelector("#keepsakeBackBtn").click();
            await waitFor(
              () => documentUnderTest.querySelector("#keepsakePage").hidden,
              "Timed out leaving Keepsake."
            );
          }
          if (!documentUnderTest.querySelector("#storyPage").hidden) {
            documentUnderTest
              .querySelector('#storyPage [data-route="board"]')
              .click();
            await waitFor(
              () => !documentUnderTest.querySelector("#boardPage").hidden,
              "Timed out returning to Home."
            );
          }
        };

        const verifyHome = (action, completed) => {
          const tile = homeTile();
          const visual = tile.querySelector(".quest-card__visual");
          const titleWords = Array.from(
            tile.querySelectorAll(".quest-title-word"),
            word => word.textContent
          );
          check(
            `${action}: Home shows illustration and title without uploaded media`,
            Boolean(
              tile.querySelector(".quest-illustration") &&
              titleWords.join(" ") === "Bodega Cat" &&
              !tile.querySelector(".quest-card-thumbnail") &&
              !tile.classList.contains("is-photo") &&
              visual.classList.contains(completed ? "is-completed" : "is-open")
            )
          );
        };

        const verifySavedViews = async (action, expectedCaption) => {
          verifyHome(action, true);

          if (documentUnderTest.querySelector("#storyPage").hidden) {
            documentUnderTest.querySelector("#viewBoardBtn").click();
            await waitFor(
              () => !documentUnderTest.querySelector("#storyPage").hidden,
              "Timed out opening Journal."
            );
          }
          const storyEntry =
            documentUnderTest.querySelector(`#storyTimeline [data-quest-id="${questId}"]`);
          const storyMedia = storyEntry?.querySelector(".story-entry-photo");
          check(
            `${action}: Journal shows the uploaded media`,
            Boolean(
              storyMedia?.tagName === "IMG" &&
              storyMedia.src.startsWith("blob:") &&
              storyEntry.querySelector(".story-caption")?.textContent === expectedCaption
            )
          );

          documentUnderTest
            .querySelector('#storyPage [data-route="keepsake"]')
            .click();
          await waitFor(
            () =>
              !documentUnderTest.querySelector("#keepsakePage").hidden &&
              documentUnderTest.querySelectorAll("#keepsakeBoard > .quest-card").length === 25,
            "Timed out opening Keepsake."
          );
          const keepsakeTile =
            documentUnderTest.querySelector("#keepsakeBoard > .quest-card:nth-child(2)");
          const keepsakeMedia = keepsakeTile?.querySelector(".keepsake-tile-photo");
          check(
            `${action}: Keepsake shows the uploaded media`,
            Boolean(
              keepsakeTile?.classList.contains("is-photo") &&
              keepsakeMedia?.tagName === "IMG" &&
              keepsakeMedia.src.startsWith("blob:")
            )
          );
        };

        await openQuest();
        await cropTestImage(
          "#f35f59",
          documentUnderTest.querySelector("#mediaInput")
        );
        const locationInput = documentUnderTest.querySelector("#locationInput");
        const captionInput = documentUnderTest.querySelector("#captionInput");
        locationInput.value = "Routing test corner";
        locationInput.dispatchEvent(new app.Event("input", { bubbles: true }));
        captionInput.value = "Completed caption";
        captionInput.dispatchEvent(new app.Event("input", { bubbles: true }));
        documentUnderTest.querySelector("#saveQuest").click();
        await waitFor(
          () =>
            savedState().submissions?.[questId] &&
            !documentUnderTest.querySelector("#storyPage").hidden,
          "Timed out completing the quest and opening Journal.",
          20000
        );
        const completedMediaId = savedState().submissions[questId].mediaId;
        await verifySavedViews("Complete", "Completed caption");

        await goToBoard();
        await openQuest();
        captionInput.value = "Edited caption";
        captionInput.dispatchEvent(new app.Event("input", { bubbles: true }));
        documentUnderTest.querySelector("#saveQuest").click();
        await waitFor(
          () =>
            savedState().submissions?.[questId]?.caption === "Edited caption" &&
            !savedState().drafts?.[questId],
          "Timed out saving the edited caption."
        );
        documentUnderTest.querySelector("#closeSheet").click();
        await nextFrame();
        check(
          "Edit: saved media identity is unchanged",
          savedState().submissions[questId].mediaId === completedMediaId
        );
        await verifySavedViews("Edit", "Edited caption");

        await goToBoard();
        await openQuest();
        await cropTestImage(
          "#1ba9b9",
          documentUnderTest.querySelector(".media-edit-button")
        );
        const replacementDraftId = savedState().drafts?.[questId]?.mediaId;
        documentUnderTest.querySelector("#saveQuest").click();
        await waitFor(
          () =>
            savedState().submissions?.[questId]?.mediaId === replacementDraftId &&
            !savedState().drafts?.[questId],
          "Timed out saving the replacement image."
        );
        documentUnderTest.querySelector("#closeSheet").click();
        await nextFrame();
        check(
          "Replace: the submission uses new media and removes the obsolete blob",
          replacementDraftId &&
            replacementDraftId !== completedMediaId &&
            !(await app.QuestMediaStore.get(completedMediaId))
        );
        await verifySavedViews("Replace", "Edited caption");

        await goToBoard();
        await openQuest();
        documentUnderTest.querySelector("#removeQuest").click();
        await nextFrame();
        documentUnderTest.querySelector("#confirmRemoveMemory").click();
        await waitFor(
          () =>
            !savedState().submissions?.[questId] &&
            documentUnderTest.querySelector("#questSheet").hidden,
          "Timed out removing the completed submission."
        );
        verifyHome("Remove", false);
        check(
          "Remove: uploaded media is deleted from storage",
          !(await app.QuestMediaStore.get(replacementDraftId))
        );

        documentUnderTest.querySelector("#viewBoardBtn").click();
        await waitFor(
          () => !documentUnderTest.querySelector("#storyPage").hidden,
          "Timed out opening Journal after removal."
        );
        check(
          "Remove: Journal no longer shows the removed submission",
          !documentUnderTest.querySelector(
            `#storyTimeline [data-quest-id="${questId}"]`
          )
        );
        documentUnderTest
          .querySelector('#storyPage [data-route="keepsake"]')
          .click();
        await waitFor(
          () => !documentUnderTest.querySelector("#keepsakePage").hidden,
          "Timed out opening Keepsake after removal."
        );
        const removedKeepsakeTile =
          documentUnderTest.querySelector("#keepsakeBoard > .quest-card:nth-child(2)");
        check(
          "Remove: Keepsake returns to the quest illustration",
          Boolean(
            !removedKeepsakeTile.classList.contains("is-photo") &&
            !removedKeepsakeTile.querySelector(".keepsake-tile-photo") &&
            removedKeepsakeTile.querySelector(".quest-illustration")
          )
        );

        const failed = checks.filter(item => !item.passed);
        result.textContent = JSON.stringify({
          status: failed.length === 0 ? "PASS" : "FAIL",
          passed: checks.length - failed.length,
          failed: failed.length,
          checks
        }, null, 2);
      } catch (error) {
        result.textContent = JSON.stringify({
          status: "FAIL",
          name: error.name,
          message: error.message,
          stack: error.stack,
          checks
        }, null, 2);
      }
    })();
  </script>
</body>
</html>
