<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Summer Quest interaction and accessibility validation</title>
  <style>
    #appFrame {
      position: absolute;
      left: -10000px;
      top: 0;
      width: 390px;
      height: 844px;
      border: 0;
    }
  </style>
</head>
<body>
  <h1>Summer Quest interaction and accessibility validation</h1>
  <pre id="result">Running…</pre>
  <iframe id="appFrame" title="Summer Quest interaction test app"></iframe>

  <script>
    (async () => {
      const result = document.querySelector("#result");
      const frame = document.querySelector("#appFrame");
      const checks = [];

      const wait = milliseconds =>
        new Promise(resolve => setTimeout(resolve, milliseconds));
      const nextFrame = () =>
        new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const waitFor = async (predicate, message) => {
        const deadline = Date.now() + 10000;
        while (Date.now() < deadline) {
          if (await predicate()) return;
          await wait(50);
        }
        throw new Error(message);
      };
      const check = (name, condition, details = "") => {
        checks.push({ name, passed: Boolean(condition), details });
      };

      try {
        localStorage.removeItem("nyc-summer-quest-mvp-v1");
        const loaded = new Promise(resolve => {
          frame.addEventListener("load", resolve, { once: true });
        });
        frame.src = "../index.html?interaction-accessibility-validation=1";
        await loaded;
        await waitFor(
          () =>
            frame.contentWindow?.SummerQuestInteractionTestHooks &&
            frame.contentDocument?.querySelectorAll("#questGrid [data-quest-id]").length === 25,
          "Timed out waiting for the test app to initialize."
        );

        const app = frame.contentWindow;
        const documentUnderTest = frame.contentDocument;
        const hooks = app.SummerQuestInteractionTestHooks;

        documentUnderTest
          .querySelector('#questGrid [data-quest-id="bodega-cat"]')
          .click();
        await nextFrame();

        const questHeader =
          documentUnderTest.querySelector("#questModalHeader");
        const questNavigation =
          documentUnderTest.querySelector(".quest-navigation");
        const questPosition =
          documentUnderTest.querySelector("#questPosition");
        const categoryPill =
          documentUnderTest.querySelector("#sheetCategory");
        const closeButton =
          documentUnderTest.querySelector("#closeSheet");
        const headerRect = questHeader.getBoundingClientRect();
        const headerNavigationRect = questNavigation.getBoundingClientRect();
        const headerCloseRect = closeButton.getBoundingClientRect();
        const headerCategoryRect = categoryPill.getBoundingClientRect();
        check(
          "Quest header keeps the category left and navigation beside close on the right",
          !documentUnderTest.querySelector("#sheetQuestNumber") &&
            questHeader.querySelector(":scope > #sheetCategory") === categoryPill &&
            questNavigation.querySelector(":scope > #previousQuest") &&
            questNavigation.querySelector(":scope > #nextQuest") &&
            questHeader.querySelector(":scope > #closeSheet") === closeButton &&
            questPosition.textContent.trim() === "2 / 25" &&
            headerCategoryRect.left >= headerRect.left - 1 &&
            headerCategoryRect.right <= headerNavigationRect.left + 1 &&
            headerNavigationRect.right <= headerCloseRect.left + 1 &&
            headerCloseRect.right <= headerRect.right + 1 &&
            headerNavigationRect.left + headerNavigationRect.width / 2 >
              headerRect.left + headerRect.width / 2 &&
            app.getComputedStyle(categoryPill).flexGrow === "0"
        );

        const savedCategoryText = categoryPill.textContent;
        frame.style.width = "320px";
        await nextFrame();
        const narrowCategoryLayouts = Object.values(app.QUEST_CATEGORIES)
          .map(category => {
            categoryPill.textContent = category.label;
            const categoryRect = categoryPill.getBoundingClientRect();
            const navigationRect = questNavigation.getBoundingClientRect();
            const closeRect = closeButton.getBoundingClientRect();
            return {
              label: category.label,
              fits:
                categoryRect.right <= navigationRect.left + 1 &&
                navigationRect.right <= closeRect.left + 1
            };
          });
        check(
          "Every category pill fits the single row at 320px",
          narrowCategoryLayouts.every(layout => layout.fits),
          narrowCategoryLayouts
        );
        categoryPill.textContent = savedCategoryText;
        frame.style.width = "390px";
        await nextFrame();

        const caption = documentUnderTest.querySelector("#captionInput");
        const questForm = documentUnderTest.querySelector("#questForm");
        const captionMetrics = () => {
          const styles = app.getComputedStyle(caption);
          const lineHeight = parseFloat(styles.lineHeight);
          const chrome = [
            styles.paddingTop,
            styles.paddingBottom,
            styles.borderTopWidth,
            styles.borderBottomWidth
          ].reduce((total, value) => total + parseFloat(value), 0);
          return {
            height: caption.getBoundingClientRect().height,
            minHeight: lineHeight * 3 + chrome,
            maxHeight: lineHeight * 9 + chrome,
            overflowY: styles.overflowY
          };
        };

        caption.value = "";
        hooks.autosizeCaption();
        const emptyCaptionMetrics = captionMetrics();
        caption.value = "A short saved memory.";
        hooks.autosizeCaption();
        const shortCaptionMetrics = captionMetrics();
        check(
          "New and short captions keep a stable three-line minimum",
          Math.abs(emptyCaptionMetrics.height - emptyCaptionMetrics.minHeight) <= 1 &&
            Math.abs(shortCaptionMetrics.height - shortCaptionMetrics.minHeight) <= 1
        );

        caption.value = Array.from(
          { length: 14 },
          (_, index) => `A reflective line ${index + 1} that wraps naturally on a phone.`
        ).join("\n");
        caption.setSelectionRange(31, 31);
        hooks.autosizeCaption();
        caption.scrollTop = 24;
        questForm.scrollTop = 10;
        hooks.autosizeCaption();
        const longCaptionMetrics = captionMetrics();
        check(
          "Long saved captions cap at nine lines and scroll internally",
          longCaptionMetrics.height <= longCaptionMetrics.maxHeight + 1 &&
            longCaptionMetrics.height >= longCaptionMetrics.maxHeight - 1 &&
            longCaptionMetrics.overflowY === "auto" &&
            caption.scrollHeight > caption.clientHeight
        );
        check(
          "Caption sizing preserves cursor and scroll positions",
          caption.selectionStart === 31 &&
            caption.selectionEnd === 31 &&
            caption.scrollTop === 24 &&
            questForm.scrollTop === 10
        );

        const saveButton = documentUnderTest.querySelector("#saveQuest");
        const savePositionBeforeFocus = app.getComputedStyle(saveButton).position;
        caption.focus();
        await nextFrame();
        hooks.syncCaptionViewport();
        hooks.positionCaptionForKeyboard();
        const captionQuestWrapper = documentUnderTest.querySelector("#questModalWrapper");
        check(
          "Caption focus activates the visual viewport without a floating primary CTA",
          captionQuestWrapper.classList.contains("is-caption-editing") &&
            app.getComputedStyle(saveButton).position === savePositionBeforeFocus &&
            !["sticky", "fixed"].includes(savePositionBeforeFocus)
        );
        await wait(400);
        const focusedCaptionFieldRect =
          caption.closest(".caption-field").getBoundingClientRect();
        const focusedFormRect = questForm.getBoundingClientRect();
        check(
          "Caption focus keeps the full field and cursor inside the visible modal",
          focusedCaptionFieldRect.top >= focusedFormRect.top + 17 &&
            focusedCaptionFieldRect.bottom <= focusedFormRect.bottom - 23 &&
            caption.selectionStart === 31 &&
            caption.selectionEnd === 31
        );
        frame.style.height = "560px";
        await nextFrame();
        hooks.syncCaptionViewport();
        hooks.positionCaptionForKeyboard();
        await wait(400);
        const keyboardCaptionFieldRect =
          caption.closest(".caption-field").getBoundingClientRect();
        const keyboardFormRect = questForm.getBoundingClientRect();
        check(
          "A keyboard-sized viewport keeps the full caption field and cursor visible",
          keyboardCaptionFieldRect.top >= keyboardFormRect.top + 17 &&
            keyboardCaptionFieldRect.bottom <= keyboardFormRect.bottom - 23 &&
            caption.selectionStart === 31 &&
            caption.selectionEnd === 31
        );
        frame.style.height = "844px";
        await nextFrame();
        hooks.syncCaptionViewport();
        check(
          "Caption helper copy encourages reflection",
          /memorable|remember|capture|read again/i.test(
            caption.getAttribute("placeholder") || ""
          )
        );

        caption.value = "";
        hooks.autosizeCaption();
        caption.blur();
        await wait(400);
        check(
          "Dismissing the keyboard restores the original bottom action layout",
          !captionQuestWrapper.classList.contains("is-caption-editing") &&
            app.getComputedStyle(saveButton).position === savePositionBeforeFocus
        );
        questForm.scrollTop = 0;

        const rewardButton = documentUnderTest.querySelector("#rewardDisclosure");
        const rewardDetails = documentUnderTest.querySelector("#rewardDetails");
        check(
          "Reward disclosure uses button semantics and controls the detail region",
          rewardButton?.tagName === "BUTTON" &&
            rewardButton.type === "button" &&
            rewardButton.getAttribute("aria-expanded") === "false" &&
            rewardButton.getAttribute("aria-controls") === rewardDetails.id
        );
        rewardButton.click();
        check(
          "Reward disclosure updates its expanded state",
          rewardButton.getAttribute("aria-expanded") === "true" &&
            documentUnderTest.querySelector(".reward-preview").classList.contains("expanded")
        );
        rewardButton.click();
        check(
          "Reward disclosure collapses with the existing behavior",
          rewardButton.getAttribute("aria-expanded") === "false" &&
            !documentUnderTest.querySelector(".reward-preview").classList.contains("expanded")
        );

        const friendsField = documentUnderTest.querySelector("#friendsField");
        const decrement = documentUnderTest.querySelector("#decrementFriends");
        const increment = documentUnderTest.querySelector("#incrementFriends");
        const friendOutput = documentUnderTest.querySelector("#friendCount");
        check(
          "Friend counter uses a labelled fieldset group",
          friendsField?.tagName === "FIELDSET" &&
            friendsField.querySelector("legend")?.textContent.trim() ===
              "How many friends joined you?" &&
            friendsField.querySelector(".counter")?.getAttribute("role") === "group"
        );
        check(
          "Friend controls and output have explicit accessible names",
          decrement.getAttribute("aria-label") === "Decrease friend count" &&
            increment.getAttribute("aria-label") === "Increase friend count" &&
            friendOutput.getAttribute("aria-label") === "Friends joined" &&
            friendOutput.getAttribute("aria-live") === "polite"
        );

        const uploadInput = documentUnderTest.querySelector("#mediaInput");
        uploadInput.focus();
        const imageFile = new app.File(
          [
            '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20">' +
              '<rect width="20" height="20" fill="#f35f59"/></svg>'
          ],
          "crop-test.svg",
          { type: "image/svg+xml" }
        );
        hooks.openCropper(imageFile, uploadInput);
        await nextFrame();

        const cropModal = documentUnderTest.querySelector("#cropModal");
        const questWrapper = documentUnderTest.querySelector("#questModalWrapper");
        const cropClose = documentUnderTest.querySelector("#closeCropModal");
        const cropConfirm = documentUnderTest.querySelector("#confirmCrop");
        check(
          "Opening crop focuses the crop modal and inerts the quest modal",
          cropModal.contains(documentUnderTest.activeElement) &&
            documentUnderTest.activeElement === cropClose &&
            questWrapper.hasAttribute("inert")
        );

        cropConfirm.focus();
        cropConfirm.dispatchEvent(new app.KeyboardEvent("keydown", {
          key: "Tab",
          bubbles: true,
          cancelable: true
        }));
        const forwardTrapWorked = documentUnderTest.activeElement === cropClose;
        cropClose.dispatchEvent(new app.KeyboardEvent("keydown", {
          key: "Tab",
          shiftKey: true,
          bubbles: true,
          cancelable: true
        }));
        check(
          "Crop modal traps forward and reverse Tab navigation",
          forwardTrapWorked && documentUnderTest.activeElement === cropConfirm
        );

        cropConfirm.dispatchEvent(new app.KeyboardEvent("keydown", {
          key: "Escape",
          bubbles: true,
          cancelable: true
        }));
        await nextFrame();
        check(
          "Escape closes only crop and restores focus to its opener",
          cropModal.hidden &&
            !documentUnderTest.querySelector("#questSheet").hidden &&
            !questWrapper.hasAttribute("inert") &&
            documentUnderTest.activeElement === uploadInput
        );

        hooks.openCropper(imageFile, uploadInput);
        await waitFor(
          () => documentUnderTest.querySelector(".cropper-container"),
          "Timed out waiting for Cropper to initialize."
        );
        documentUnderTest.querySelector("#confirmCrop").click();
        await waitFor(
          () =>
            cropModal.hidden &&
            !documentUnderTest.querySelector("#mediaPreview").hidden,
          "Timed out waiting for the cropped draft to save."
        );
        const savedState = JSON.parse(
          app.localStorage.getItem("nyc-summer-quest-mvp-v1") || "{}"
        );
        const savedCropRecord = savedState.drafts?.["bodega-cat"];
        const savedCropBlob = await app.QuestMediaStore.get(savedCropRecord?.mediaId);
        const savedCropBitmap = await app.createImageBitmap(savedCropBlob);
        const expectedCropSize = app.QuestMediaStore.imageSettings.longestEdge;
        check(
          "Crop saves one configured square JPEG draft and restores the quest layer",
          savedCropBlob?.type === "image/jpeg" &&
            savedCropBitmap.width === expectedCropSize &&
            savedCropBitmap.height === expectedCropSize &&
            cropModal.hidden &&
            !questWrapper.hasAttribute("inert") &&
            documentUnderTest.activeElement === uploadInput
        );
        savedCropBitmap.close();

        const mediaUpload = documentUnderTest.querySelector("#mediaUpload");
        const previewImageButton =
          documentUnderTest.querySelector(".media-preview-image-button");
        const cameraButton =
          documentUnderTest.querySelector(".media-edit-button");
        const cameraStyle = app.getComputedStyle(cameraButton);
        check(
          "Saved media replaces the upload card with two accessible edit affordances",
          mediaUpload.hidden &&
            !documentUnderTest.querySelector("#mediaPreview").hidden &&
            uploadInput.getAttribute("aria-hidden") === "true" &&
            uploadInput.tabIndex === -1 &&
            previewImageButton?.getAttribute("aria-label") === "Replace photo" &&
            cameraButton?.getAttribute("aria-label") === "Replace photo" &&
            parseFloat(cameraStyle.width) >= 44 &&
            parseFloat(cameraStyle.height) >= 44
        );

        const locationInput =
          documentUnderTest.querySelector("#locationInput");
        locationInput.value = "The corner bodega";
        locationInput.dispatchEvent(new app.Event("input", { bubbles: true }));
        caption.value = "A patient orange shop manager.";
        caption.dispatchEvent(new app.Event("input", { bubbles: true }));
        increment.click();
        increment.click();
        const bonusInput =
          documentUnderTest.querySelector(".bonus-option-input");
        bonusInput.checked = true;
        bonusInput.dispatchEvent(new app.Event("change", { bubbles: true }));

        const firstState = JSON.parse(
          app.localStorage.getItem("nyc-summer-quest-mvp-v1") || "{}"
        );
        const firstDraft = firstState.drafts?.["bodega-cat"];
        const firstMediaId = firstDraft?.mediaId;
        const firstPreviewSource =
          documentUnderTest.querySelector(".media-preview-element")?.src;

        hooks.openCropper(imageFile, cameraButton);
        await waitFor(
          () => documentUnderTest.querySelector(".cropper-container"),
          "Timed out waiting for the first replacement cropper."
        );
        documentUnderTest.querySelector("#confirmCrop").click();
        await waitFor(() => {
          const replacementState = JSON.parse(
            app.localStorage.getItem("nyc-summer-quest-mvp-v1") || "{}"
          );
          return (
            cropModal.hidden &&
            replacementState.drafts?.["bodega-cat"]?.mediaId !== firstMediaId &&
            documentUnderTest.querySelector(".media-preview-element")?.src !==
              firstPreviewSource
          );
        }, "Timed out waiting for the first replacement to save.");

        const secondState = JSON.parse(
          app.localStorage.getItem("nyc-summer-quest-mvp-v1") || "{}"
        );
        const secondDraft = secondState.drafts?.["bodega-cat"];
        const secondMediaId = secondDraft?.mediaId;
        const secondPreviewSource =
          documentUnderTest.querySelector(".media-preview-element")?.src;
        check(
          "Replacing an image updates the preview and only changes draft media",
          secondMediaId &&
            secondMediaId !== firstMediaId &&
            secondPreviewSource &&
            secondPreviewSource !== firstPreviewSource &&
            secondDraft.caption === firstDraft.caption &&
            secondDraft.location === firstDraft.location &&
            secondDraft.friends === firstDraft.friends &&
            JSON.stringify(secondDraft.selectedBonusIds) ===
              JSON.stringify(firstDraft.selectedBonusIds) &&
            !secondState.submissions?.["bodega-cat"] &&
            !(await app.QuestMediaStore.get(firstMediaId)),
          {
            mediaChanged: Boolean(secondMediaId && secondMediaId !== firstMediaId),
            previewChanged: Boolean(
              secondPreviewSource && secondPreviewSource !== firstPreviewSource
            ),
            caption: secondDraft?.caption,
            location: secondDraft?.location,
            friends: secondDraft?.friends,
            selectedBonusIds: secondDraft?.selectedBonusIds,
            hasCompletedSubmission: Boolean(
              secondState.submissions?.["bodega-cat"]
            ),
            previousMediaRemoved: !(await app.QuestMediaStore.get(firstMediaId))
          }
        );

        const replacementCameraButton =
          documentUnderTest.querySelector(".media-edit-button");
        hooks.openCropper(imageFile, replacementCameraButton);
        await waitFor(
          () => documentUnderTest.querySelector(".cropper-container"),
          "Timed out waiting for the consecutive replacement cropper."
        );
        documentUnderTest.querySelector("#confirmCrop").click();
        await waitFor(() => {
          const replacementState = JSON.parse(
            app.localStorage.getItem("nyc-summer-quest-mvp-v1") || "{}"
          );
          return (
            cropModal.hidden &&
            replacementState.drafts?.["bodega-cat"]?.mediaId !== secondMediaId
          );
        }, "Timed out waiting for the consecutive replacement to save.");

        const thirdState = JSON.parse(
          app.localStorage.getItem("nyc-summer-quest-mvp-v1") || "{}"
        );
        const thirdDraft = thirdState.drafts?.["bodega-cat"];
        check(
          "The same image can be selected repeatedly without losing quest data",
          thirdDraft?.mediaId &&
            thirdDraft.mediaId !== secondMediaId &&
            thirdDraft.caption === secondDraft.caption &&
            thirdDraft.location === secondDraft.location &&
            thirdDraft.friends === secondDraft.friends &&
            JSON.stringify(thirdDraft.selectedBonusIds) ===
              JSON.stringify(secondDraft.selectedBonusIds) &&
            !(await app.QuestMediaStore.get(secondMediaId))
        );

        const questTitleBeforeSwipe =
          documentUnderTest.querySelector("#sheetTitle").textContent;
        const questContent = documentUnderTest.querySelector("#questContent");
        questContent.dispatchEvent(new app.PointerEvent("pointerdown", {
          pointerId: 1,
          clientX: 330,
          clientY: 300,
          bubbles: true
        }));
        questContent.dispatchEvent(new app.PointerEvent("pointermove", {
          pointerId: 1,
          clientX: 40,
          clientY: 302,
          bubbles: true
        }));
        questContent.dispatchEvent(new app.PointerEvent("pointerup", {
          pointerId: 1,
          clientX: 40,
          clientY: 302,
          bubbles: true
        }));
        await wait(250);
        check(
          "Horizontal pointer swipes do not navigate between quests",
          documentUnderTest.querySelector("#sheetTitle").textContent ===
            questTitleBeforeSwipe
        );

        documentUnderTest.querySelector("#closeSheet").focus();
        documentUnderTest.querySelector("#closeSheet").dispatchEvent(
          new app.KeyboardEvent("keydown", {
            key: "ArrowRight",
            bubbles: true,
            cancelable: true
          })
        );
        const buttonTransitionPreserved =
          questContent.classList.contains("quest-exit-next");
        await wait(400);
        check(
          "Arrow-key navigation and quest transition classes remain available",
          buttonTransitionPreserved &&
            documentUnderTest.querySelector("#sheetTitle").textContent ===
              "Subway Romance"
        );

        documentUnderTest.querySelector("#nextQuest").click();
        await wait(400);
        const nextButtonWorked =
          documentUnderTest.querySelector("#sheetTitle").textContent ===
            "Water Wonders";
        documentUnderTest.querySelector("#previousQuest").click();
        await wait(400);
        check(
          "Previous and Next buttons still navigate between quests",
          nextButtonWorked &&
            documentUnderTest.querySelector("#sheetTitle").textContent ===
              "Subway Romance"
        );

        let swipePointerId = 20;
        const dispatchQuestSwipe = ({
          target = questPosition,
          startX = 190,
          startY = 42,
          endX = startX,
          endY
        }) => {
          swipePointerId += 1;
          const pointerInit = {
            pointerId: swipePointerId,
            pointerType: "touch",
            isPrimary: true,
            clientX: startX,
            clientY: startY,
            bubbles: true,
            cancelable: true
          };
          target.dispatchEvent(new app.PointerEvent("pointerdown", pointerInit));
          target.dispatchEvent(new app.PointerEvent("pointermove", {
            ...pointerInit,
            clientX: endX,
            clientY: endY
          }));
          target.dispatchEvent(new app.PointerEvent("pointerup", {
            ...pointerInit,
            clientX: endX,
            clientY: endY
          }));
        };

        const questSheet = documentUnderTest.querySelector("#questSheet");
        const questFormForSwipe = documentUnderTest.querySelector("#questForm");
        caption.value = Array.from(
          { length: 12 },
          (_, index) => `Scroll guard line ${index + 1}`
        ).join("\n");
        hooks.autosizeCaption();
        questFormForSwipe.scrollTop = 20;
        dispatchQuestSwipe({ endY: 220 });
        await wait(30);
        check(
          "Swipe dismissal cannot start while modal content is scrolled",
          !questSheet.hidden &&
            !questSheet.classList.contains("is-swipe-settling") &&
            !questSheet.style.transform
        );

        caption.value = "";
        hooks.autosizeCaption();
        questFormForSwipe.scrollTop = 0;
        documentUnderTest.querySelector("#locationInput").focus();
        dispatchQuestSwipe({ endY: 220 });
        await wait(30);
        check(
          "Swipe dismissal is blocked while a form control is focused",
          !questSheet.hidden &&
            documentUnderTest.activeElement.id === "locationInput" &&
            !questSheet.style.transform
        );
        documentUnderTest.querySelector("#locationInput").blur();
        await wait(360);

        dispatchQuestSwipe({ endY: 70 });
        await wait(240);
        check(
          "A short downward drag snaps back without dismissing",
          !questSheet.hidden &&
            !questSheet.classList.contains("is-swipe-settling") &&
            !questSheet.style.transform
        );

        dispatchQuestSwipe({
          target: documentUnderTest.querySelector("#nextQuest"),
          endY: 230
        });
        await wait(30);
        check(
          "Header buttons never initiate swipe dismissal",
          !questSheet.hidden &&
            !questSheet.classList.contains("is-swipe-dragging") &&
            !questSheet.style.transform
        );

        dispatchQuestSwipe({ endY: 240 });
        await wait(240);
        check(
          "A deliberate header drag closes the quest through the normal modal path",
          questSheet.hidden &&
            documentUnderTest.querySelector("#questModalWrapper").hidden &&
            !documentUnderTest.body.classList.contains("sheet-open")
        );

        documentUnderTest
          .querySelector('#questGrid [data-quest-id="bodega-cat"]')
          .click();
        await nextFrame();

        documentUnderTest.querySelector("#closeSheet").click();
        await nextFrame();
        check(
          "Close button still dismisses the quest modal",
          questSheet.hidden &&
            documentUnderTest.querySelector("#questModalWrapper").hidden
        );
        documentUnderTest
          .querySelector('#questGrid [data-quest-id="bodega-cat"]')
          .click();
        await nextFrame();

        documentUnderTest.querySelector("#closeSheet").focus();
        documentUnderTest.querySelector("#closeSheet").dispatchEvent(
          new app.KeyboardEvent("keydown", {
            key: "Escape",
            bubbles: true,
            cancelable: true
          })
        );
        await nextFrame();
        check(
          "Escape still dismisses the quest modal",
          questSheet.hidden &&
            documentUnderTest.querySelector("#questModalWrapper").hidden
        );
        documentUnderTest
          .querySelector('#questGrid [data-quest-id="bodega-cat"]')
          .click();
        await nextFrame();

        const removeLink = documentUnderTest.querySelector("#removeQuest");
        removeLink.hidden = false;
        removeLink.focus();
        removeLink.click();
        await nextFrame();
        const removeModal = documentUnderTest.querySelector("#removeMemoryModal");
        const removeDialog = removeModal.querySelector("[role='dialog']");
        const keepMemory = documentUnderTest.querySelector("#keepMemory");
        const confirmRemove = documentUnderTest.querySelector("#confirmRemoveMemory");
        check(
          "Remove Memory opens a labelled top-level confirmation dialog",
          !removeModal.hidden &&
            removeDialog.getAttribute("aria-modal") === "true" &&
            removeDialog.getAttribute("aria-labelledby") === "removeMemoryTitle" &&
            removeDialog.getAttribute("aria-describedby") === "removeMemoryDescription" &&
            questWrapper.hasAttribute("inert") &&
            documentUnderTest.querySelector("#boardPage").hasAttribute("inert") &&
            documentUnderTest.activeElement === keepMemory
        );
        confirmRemove.focus();
        confirmRemove.dispatchEvent(new app.KeyboardEvent("keydown", {
          key: "Tab",
          bubbles: true,
          cancelable: true
        }));
        check(
          "Remove confirmation traps focus",
          documentUnderTest.activeElement === keepMemory
        );
        keepMemory.dispatchEvent(new app.KeyboardEvent("keydown", {
          key: "Escape",
          bubbles: true,
          cancelable: true
        }));
        await nextFrame();
        check(
          "Escape closes only removal confirmation and restores its opener",
          removeModal.hidden &&
            !documentUnderTest.querySelector("#questSheet").hidden &&
            !questWrapper.hasAttribute("inert") &&
            !documentUnderTest.querySelector("#boardPage").hasAttribute("inert") &&
            documentUnderTest.activeElement === removeLink
        );
        removeLink.click();
        await nextFrame();
        keepMemory.click();
        await nextFrame();
        check(
          "Keep Memory cancels and returns focus without closing the quest",
          removeModal.hidden &&
            !documentUnderTest.querySelector("#questSheet").hidden &&
            documentUnderTest.activeElement === removeLink
        );
        removeLink.click();
        await nextFrame();
        removeModal.click();
        await nextFrame();
        check(
          "Clicking outside the confirmation never confirms removal",
          removeModal.hidden &&
            !documentUnderTest.querySelector("#questSheet").hidden
        );

        const closeRect = documentUnderTest
          .querySelector("#closeSheet")
          .getBoundingClientRect();
        const previousRect = documentUnderTest
          .querySelector("#previousQuest")
          .getBoundingClientRect();
        const nextRect = documentUnderTest
          .querySelector("#nextQuest")
          .getBoundingClientRect();
        const desktopPreviousStyle = app.getComputedStyle(
          documentUnderTest.querySelector("#desktopPreviousQuest")
        );
        const stickyStyle = app.getComputedStyle(
          documentUnderTest.querySelector(".sticky-back-button")
        );
        const expandStyle = app.getComputedStyle(
          documentUnderTest.querySelector("#expandKeepsakeBtn")
        );
        check(
          "Required tap targets are at least 44 by 44 CSS pixels",
          closeRect.width >= 43.5 &&
            closeRect.height >= 43.5 &&
            previousRect.width >= 43.5 &&
            previousRect.height >= 43.5 &&
            nextRect.width >= 43.5 &&
            nextRect.height >= 43.5 &&
            parseFloat(desktopPreviousStyle.width) >= 43.5 &&
            parseFloat(desktopPreviousStyle.height) >= 43.5 &&
            parseFloat(stickyStyle.minHeight) >= 43.5 &&
            parseFloat(expandStyle.width) >= 43.5 &&
            parseFloat(expandStyle.height) >= 43.5
        );

        const rootStyles = app.getComputedStyle(documentUnderTest.documentElement);
        check(
          "Original brand tokens are restored without contrast-only text tokens",
          rootStyles.getPropertyValue("--teal").trim() === "#1ba9b9" &&
            rootStyles.getPropertyValue("--coral").trim() === "#f35f59" &&
            rootStyles.getPropertyValue("--paper").trim() === "#f7f2e9" &&
            !rootStyles.getPropertyValue("--teal-text").trim() &&
            !rootStyles.getPropertyValue("--coral-text").trim()
        );

        const stylesheet = await fetch("../style.css").then(response => response.text());
        const appSource = await fetch("../data/app.js").then(response => response.text());
        const mediaStorageSource = await fetch("../data/mediaStorage.js")
          .then(response => response.text());
        check(
          "Mobile board spacing preserves the top safe-area inset",
          /#boardPage\s*\{\s*padding-top:\s*env\(safe-area-inset-top\)/.test(
            stylesheet
          ) &&
            !/@media\s*\(max-width:\s*620px\)[\s\S]*?\.app-shell\s*\{\s*padding-top:\s*0/.test(
              stylesheet
            )
        );
        check(
          "Crop has one implementation and one lossy JPEG encoding path",
          (appSource.match(/function openCropper\s*\(/g) || []).length === 1 &&
            /getCroppedImageBlob\(\)/.test(appSource) &&
            appSource.includes("mediaStore.imageSettings.jpegQuality") &&
            /jpegQuality:\s*0\.75/.test(mediaStorageSource) &&
            !/compressImage\s*\(\s*(?:croppedBlob|await\s+getCroppedImageBlob)/.test(
              appSource
            )
        );
        check(
          "Photo replacement keeps its 220ms fade without enabling Home board thumbnails",
          /\{\s*duration:\s*100,\s*easing:\s*["']ease-in["']\s*\}/.test(
            appSource
          ) &&
            /\{\s*duration:\s*120,\s*easing:\s*["']ease-out["']\s*\}/.test(
              appSource
            ) &&
            !/quest-card-thumbnail/.test(appSource) &&
            !/#questGrid\s*>\s*\.quest-card\.is-photo/.test(stylesheet)
        );

        const failed = checks.filter(item => !item.passed);
        result.textContent = JSON.stringify({
          status: failed.length === 0 ? "PASS" : "FAIL",
          passed: checks.length - failed.length,
          failed: failed.length,
          checks
        }, null, 2);
      } catch (error) {
        result.textContent = JSON.stringify({
          status: "FAIL",
          name: error.name,
          message: error.message,
          stack: error.stack,
          checks
        }, null, 2);
      }
    })();
  </script>
</body>
</html>
