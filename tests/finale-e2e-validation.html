<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Summer Quest finale end-to-end validation</title>
  <style>
    body {
      margin: 20px;
      font: 14px/1.45 system-ui, sans-serif;
    }

    #appFrame {
      display: block;
      width: 375px;
      height: 667px;
      margin-top: 16px;
      border: 1px solid #ccc;
    }

    pre {
      max-width: 80ch;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Summer Quest finale end-to-end validation</h1>
  <pre id="result">Running…</pre>
  <iframe
    id="appFrame"
    title="Phone-sized Summer Quest validation frame"
    src="about:blank"
  ></iframe>

  <script src="../data/quests.js"></script>
  <script src="../data/boardConfig.js"></script>
  <script src="../data/mediaStorage.js"></script>
  <script>
    (async () => {
      const result = document.querySelector("#result");
      const frame = document.querySelector("#appFrame");
      const storageKey = "nyc-summer-quest-mvp-v1";
      const checks = [];
      const mediaIds = window.BOARD_ORDER.map(
        (_, index) => `finale-e2e-photo-${index + 1}`
      );

      function check(name, condition, details = "") {
        checks.push({ name, passed: Boolean(condition), details });
      }

      function waitFor(condition, message, timeout = 15000) {
        const startedAt = Date.now();
        return new Promise((resolve, reject) => {
          const inspect = () => {
            let value = false;
            try {
              value = condition();
            } catch {
              // The iframe may be between documents while reloading.
            }
            if (value) {
              resolve(value);
              return;
            }
            if (Date.now() - startedAt >= timeout) {
              reject(new Error(message));
              return;
            }
            window.setTimeout(inspect, 50);
          };
          inspect();
        });
      }

      function waitForFrameLoad() {
        return new Promise((resolve) => {
          frame.addEventListener("load", resolve, { once: true });
        });
      }

      function imageBlob(index) {
        const canvas = document.createElement("canvas");
        canvas.width = 180;
        canvas.height = 180;
        const context = canvas.getContext("2d");
        const hue = (index * 37 + 14) % 360;
        const gradient = context.createLinearGradient(0, 0, 180, 180);
        gradient.addColorStop(0, `hsl(${hue} 68% 68%)`);
        gradient.addColorStop(1, `hsl(${(hue + 54) % 360} 58% 38%)`);
        context.fillStyle = gradient;
        context.fillRect(0, 0, 180, 180);
        context.fillStyle = "rgba(255,255,255,.9)";
        context.beginPath();
        context.arc(90, 78, 45 + index % 9, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "#173b3f";
        context.font = "700 28px system-ui";
        context.textAlign = "center";
        context.fillText(String(index + 1).padStart(2, "0"), 90, 88);
        context.font = "600 13px system-ui";
        context.fillText("SUMMER", 90, 137);

        return new Promise((resolve, reject) => {
          canvas.toBlob(
            (blob) => blob
              ? resolve(blob)
              : reject(new Error("Fixture image encoding failed.")),
            "image/jpeg",
            0.82
          );
        });
      }

      function reducedMotionMatchMedia(query) {
        return {
          matches: query === "(prefers-reduced-motion: reduce)",
          media: query,
          onchange: null,
          addListener() {},
          removeListener() {},
          addEventListener() {},
          removeEventListener() {},
          dispatchEvent() {
            return false;
          }
        };
      }

      try {
        await window.QuestMediaStore.clearDatabase();
        const blobs = await Promise.all(
          window.BOARD_ORDER.map((_, index) => imageBlob(index))
        );
        await Promise.all(
          blobs.map((blob, index) =>
            window.QuestMediaStore.put(mediaIds[index], blob)
          )
        );

        const startTime = Date.UTC(2026, 5, 1, 12);
        const submissions = {};
        window.BOARD_ORDER.slice(0, -1).forEach((questId, index) => {
          submissions[questId] = {
            questId,
            completed: true,
            mediaId: mediaIds[index],
            mediaType: "image/jpeg",
            friends: index % 3,
            location: `Fixture stop ${index + 1}`,
            caption: `Summer memory ${index + 1}`,
            selectedBonusIds: [],
            completedAt: new Date(startTime + index * 3600000).toISOString()
          };
        });

        localStorage.setItem(storageKey, JSON.stringify({
          submissions,
          drafts: {
            "party-time": {
              questId: "party-time",
              mediaId: mediaIds[24],
              mediaType: "image/jpeg",
              friends: 0,
              location: "Birthday celebration",
              caption: "The final summer memory",
              selectedBonusIds: [],
              finalUnlocked: true,
              gateAnswer: "4"
            }
          },
          questDataMigrationVersion: 3
        }));

        const initialLoad = waitForFrameLoad();
        frame.src = "../?finale-validation=1&finale-e2e=1";
        await initialLoad;
        await waitFor(
          () => frame.contentDocument?.querySelectorAll(
            "#questGrid [data-quest-id]"
          ).length === 25,
          "The seeded board did not render."
        );

        const appDocument = frame.contentDocument;
        appDocument
          .querySelector('[data-quest-id="party-time"]')
          .click();
        await waitFor(
          () => {
            const saveButton = appDocument.querySelector("#saveQuest");
            return saveButton &&
              !saveButton.disabled &&
              saveButton.textContent.trim() === "Complete Final Quest";
          },
          "The Final Quest did not open with its seeded draft."
        );

        appDocument.querySelector("#saveQuest").click();
        const overlay = await waitFor(
          () => appDocument.querySelector("[data-final-quest-finale]"),
          "The finale did not start after the first successful final save."
        );

        const board = overlay.querySelector(".finale-board");
        const boardRect = board.getBoundingClientRect();
        const viewportWidth = frame.contentWindow.innerWidth;
        const boardWidthRatio = boardRect.width / viewportWidth;
        check(
          "The production trigger starts the finale after Quest 25 is saved",
          Boolean(overlay)
        );
        check(
          "The 5×5 board is the phone-sized visual hero",
          overlay.querySelectorAll(".finale-tile").length === 25 &&
            boardWidthRatio >= 0.75 &&
            boardWidthRatio <= 0.86,
          { boardWidthRatio, tileCount: overlay.querySelectorAll(".finale-tile").length }
        );
        check(
          "The completed board contains icons without quest labels",
          Array.from(overlay.querySelectorAll(".finale-tile-front"))
            .every((face) => face.textContent.trim() === "" && face.querySelector("img"))
        );
        const animatedFinalRank = overlay
          .querySelector(".finale-rank.is-final")
          ?.textContent.trim();
        const calculatedSummaryRank = appDocument
          .querySelector(".adventure-rank-value")
          ?.textContent.trim();
        check(
          "The rank review ends on the real calculated production rank",
          Boolean(animatedFinalRank) &&
            animatedFinalRank === calculatedSummaryRank,
          { animatedFinalRank, calculatedSummaryRank }
        );

        await waitFor(
          () => overlay.querySelectorAll(".finale-tile.has-photo").length === 25,
          "Not all 25 locally stored images were prepared."
        );
        check(
          "All 25 locally stored images load into the mosaic",
          overlay.querySelectorAll(".finale-tile.has-photo").length === 25
        );

        await new Promise((resolve) => window.setTimeout(resolve, 4100));
        const flipProgress = Array.from(
          overlay.querySelectorAll(".finale-tile-card")
        ).map((card) =>
          card.getAnimations()
            .map((animation) => animation.effect?.getComputedTiming().progress)
            .find((progress) => typeof progress === "number") || 0
        );
        const startedFlips = flipProgress.filter((progress) => progress > 0).length;
        const activeFlips = flipProgress.filter(
          (progress) => progress > 0 && progress < 1
        ).length;
        check(
          "The real cascade reaches a partially flipped mosaic state",
          startedFlips > 0 && startedFlips < 25 && activeFlips > 0,
          { startedFlips, activeFlips }
        );

        await waitFor(
          () => !appDocument.querySelector("[data-final-quest-finale]"),
          "The finale did not hand off to the Final Summary.",
          15000
        );
        const savedState = JSON.parse(localStorage.getItem(storageKey));
        const summaryVisible =
          !appDocument.querySelector("#questModalWrapper").hidden &&
          !appDocument.querySelector("#finalResults").hidden &&
          Boolean(appDocument.querySelector("#finalCompleteHeading"));
        check(
          "Quest 25 is committed before the animation and its draft is removed",
          savedState.submissions["party-time"]?.completed === true &&
            !savedState.drafts["party-time"]
        );
        check(
          "The overlay is removed and the existing Final Summary remains",
          summaryVisible &&
            !appDocument.querySelector("[data-final-quest-finale]")
        );
        check(
          "Focus moves into the real summary after the finale",
          appDocument.activeElement?.id === "closeSheet",
          appDocument.activeElement?.id
        );

        const completionOrder = frame.contentWindow
          .SummerQuestFinaleTestHooks
          .completionOrder(
            frame.contentWindow.SummerQuestFinaleTestHooks.finaleEntries()
          )
          .map((entry) => entry.questId);
        check(
          "Photo order follows timestamps and keeps Quest 25 last",
          completionOrder.join(",") === window.BOARD_ORDER.join(",") &&
            completionOrder[24] === "party-time",
          completionOrder
        );

        const reload = waitForFrameLoad();
        frame.contentWindow.location.reload();
        await reload;
        await waitFor(
          () => frame.contentDocument?.querySelectorAll(
            "#questGrid [data-quest-id]"
          ).length === 25,
          "The board did not return after refresh."
        );
        const refreshedDocument = frame.contentDocument;
        await new Promise((resolve) => window.setTimeout(resolve, 350));
        const replayedOnRefresh = Boolean(
          refreshedDocument.querySelector("[data-final-quest-finale]")
        );
        refreshedDocument
          .querySelector('[data-quest-id="party-time"]')
          .click();
        await waitFor(
          () => !refreshedDocument.querySelector("#finalResults").hidden,
          "The completed Final Quest did not reopen its summary."
        );
        await new Promise((resolve) => window.setTimeout(resolve, 250));
        check(
          "Refresh and summary reopen do not replay the finale",
          !replayedOnRefresh &&
            !refreshedDocument.querySelector("[data-final-quest-finale]")
        );

        await window.QuestMediaStore.remove(mediaIds[7]);
        Object.defineProperty(frame.contentWindow, "matchMedia", {
          configurable: true,
          value: reducedMotionMatchMedia
        });
        const reducedStartedAt = performance.now();
        const replayPromise =
          frame.contentWindow.SummerQuestFinaleTestHooks.replay();
        const reducedOverlay = await waitFor(
          () => refreshedDocument.querySelector("[data-final-quest-finale]"),
          "The reduced-motion validation replay did not start."
        );
        await waitFor(
          () => reducedOverlay.querySelectorAll(".finale-tile.has-photo").length === 24,
          "The missing-photo fallback state was not reached.",
          3000
        );
        const reducedResult = await replayPromise;
        const reducedElapsed = performance.now() - reducedStartedAt;
        check(
          "A missing photo keeps its completed illustration without breaking the run",
          reducedResult.played &&
            reducedResult.photoCount === 24 &&
            !reducedOverlay
              .querySelector(
                `[data-finale-quest-id="${window.BOARD_ORDER[7]}"] .finale-tile-fallback`
              )
              .hidden,
          { photoCount: reducedResult.photoCount }
        );
        check(
          "Reduced motion reaches the same summary in under two seconds",
          reducedResult.reducedMotion &&
            reducedElapsed < 2000 &&
            !refreshedDocument.querySelector("[data-final-quest-finale]") &&
            !refreshedDocument.querySelector("#finalResults").hidden,
          { reducedElapsed }
        );

        refreshedDocument.querySelector("#closeSheet").click();
        await waitFor(
          () => refreshedDocument.querySelector("#questModalWrapper").hidden,
          "The Final Summary did not close normally."
        );
        check(
          "Closing the summary restores the normal board state",
          refreshedDocument.querySelector("#boardPage") &&
            !refreshedDocument.querySelector("#boardPage").hasAttribute("inert") &&
            !refreshedDocument.body.classList.contains("finale-open") &&
            refreshedDocument.querySelector("#sheetBackdrop").hidden
        );

        const failed = checks.filter((item) => !item.passed);
        result.textContent = JSON.stringify({
          status: failed.length ? "FAIL" : "PASS",
          passed: checks.length - failed.length,
          failed: failed.length,
          checks
        }, null, 2);
      } catch (error) {
        result.textContent = JSON.stringify({
          status: "FAIL",
          name: error.name,
          message: error.message,
          checks
        }, null, 2);
      } finally {
        localStorage.removeItem(storageKey);
        await window.QuestMediaStore.clearDatabase().catch(() => {});
      }
    })();
  </script>
</body>
</html>
